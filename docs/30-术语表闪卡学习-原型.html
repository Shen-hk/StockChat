<!DOCTYPE html>
<html lang="zh-CN" data-page-node-id="XmFd3PhxNjw2LIDrusyOv7">

<title>知识库 · 术语闪卡学习原型</title>
<!--
  30 · 术语表闪卡学习原型
  对应：doc 23「知识库」三层知识架构 · FR-K2 术语掌握状态 · FR-K6 拼音检索 · FR-K9 相关术语
  数据源：shared/.../data/entity/Glossary.kt（80 词全量 + 拼音首字母 + 依赖路径）
  玩法：百词斩式卡片轮学（翻面 → 认识/模糊/不会，不会的词自动回队重学）+ 搜索 + 测验 + 掌握度
-->
<style>
  :root{
    --bg:#F5F6F8; --card:#FFFFFF; --ink:#1C1F24; --sub:#8A919C; --line:#ECEEF2;
    --red:#E05252; --red-soft:#FDEEEE; --green:#1E9E6F; --green-soft:#E9F7F1;
    --amber:#E8A13C; --amber-soft:#FCF3E4; --blue:#5B7CFA; --purple:#8B5CF6;
    --radius:20px;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    display:flex; justify-content:center;
  }
  #app{
    width:100%; max-width:430px; min-height:100%;
    display:flex; flex-direction:column; position:relative;
  }
  /* ───── 顶栏 ───── */
  header{
    padding:20px 20px 12px; display:flex; align-items:flex-end; justify-content:space-between;
  }
  header h1{font-size:22px; letter-spacing:.5px}
  header .sub{font-size:12px; color:var(--sub); margin-top:4px}
  header .today{
    text-align:right; font-size:12px; color:var(--sub); line-height:1.5;
  }
  header .today b{font-size:18px; color:var(--red); font-family:ui-rounded,sans-serif}
  /* ───── 主区 ───── */
  main{flex:1; padding:0 16px 96px}
  .page{display:none; animation:fadein .25s ease}
  .page.active{display:block}
  @keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  /* 分类筛选 chips */
  .chips{display:flex; gap:8px; overflow-x:auto; padding:8px 4px 12px; scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{
    flex:none; padding:7px 14px; border-radius:999px; background:var(--card);
    border:1px solid var(--line); font-size:13px; color:var(--sub); cursor:pointer;
    transition:all .15s;
  }
  .chip.on{background:var(--ink); color:#fff; border-color:var(--ink)}

  /* 学习进度条 */
  .learnbar{display:flex; align-items:center; gap:10px; padding:2px 4px 12px}
  .learnbar .track{flex:1; height:6px; border-radius:3px; background:var(--line); overflow:hidden}
  .learnbar .fill{height:100%; border-radius:3px; background:linear-gradient(90deg,var(--red),#F08A5D); width:0%; transition:width .3s}
  .learnbar .num{font-size:12px; color:var(--sub); flex:none}
  .learnbar .streak{flex:none; font-size:12px; color:var(--amber); font-weight:600; opacity:0; transition:opacity .2s}
  .learnbar .streak.show{opacity:1}

  /* ───── 卡片轮播（拖拽距离 + 甩动速度决定翻页，居中卡片展开详情） ───── */
  .car-viewport{position:relative; height:480px; overflow:hidden; margin:0 0 2px; touch-action:pan-y}
  .car-track{position:absolute; inset:0}
  .car-card{
    position:absolute; top:6px; height:466px; width:min(calc(100% - 76px), 340px);
    border-radius:var(--radius); background:var(--card);
    border:1px solid var(--line); box-shadow:0 12px 32px rgba(28,31,36,.08);
    padding:20px; display:flex; flex-direction:column; overflow:hidden;
    transition:transform .42s cubic-bezier(.2,.7,.3,1), opacity .42s, box-shadow .42s;
    will-change:transform; cursor:pointer; user-select:none; -webkit-user-select:none;
  }
  .car-track.dragging .car-card{transition:none}
  .car-card.sel{box-shadow:0 18px 44px rgba(28,31,36,.15); cursor:default}
  /* 未选中：紧凑态，只显示大字术语 */
  .car-card .cc-front{flex:1; display:flex; flex-direction:column; justify-content:center; min-height:0}
  .car-card.sel .cc-front{display:none}
  /* 选中：详情态，自动展开完整信息 */
  .car-card .cc-detail{display:none; flex:1; min-height:0; flex-direction:column}
  .car-card.sel .cc-detail{display:flex; overflow-y:auto; margin-top:10px; padding-right:2px}
  .car-card.sel .cc-detail::-webkit-scrollbar{width:0}
  .car-card .cc-detail .term-line{font-size:20px; font-weight:700; margin-bottom:2px; flex:none}
  .car-card .cc-detail .sec{margin-top:14px; flex:none}
  .car-card .cc-detail .sec .lab{font-size:11px; color:var(--sub); letter-spacing:2px; margin-bottom:6px}
  .car-card .cc-detail .plain{font-size:15.5px; line-height:1.7}
  .car-card .cc-detail .example{
    font-size:13px; line-height:1.7; color:#5B6470; background:#F7F8FA;
    border-left:3px solid var(--red); padding:10px 12px; border-radius:0 10px 10px 0;
  }
  .car-card .cc-detail .adv{
    font-size:12.5px; line-height:1.7; color:#5B6470;
    max-height:0; overflow:hidden; transition:max-height .3s ease;
  }
  .car-card .cc-detail .adv.open{max-height:170px; overflow-y:auto}
  .cat-tag{
    align-self:flex-start; font-size:11px; padding:3px 10px; border-radius:999px; color:#fff;
  }
  .term-big{font-size:42px; font-weight:700; text-align:center; letter-spacing:1px; line-height:1.15; word-break:break-all}
  .term-ascii{font-size:16px; color:var(--sub); text-align:center; margin-top:6px}
  .term-alias{text-align:center; font-size:12px; color:var(--sub); margin-top:10px; line-height:1.7}
  .pre-chips{display:flex; flex-wrap:wrap; gap:6px; justify-content:center; margin-top:16px}
  .pre-chips .pc{
    font-size:11px; color:var(--blue); background:#EEF1FE; padding:4px 10px; border-radius:999px; cursor:pointer;
  }
  .rel-chips{display:flex; flex-wrap:wrap; gap:6px; margin-top:14px}
  .adv-toggle{
    display:inline-block; font-size:12px; color:var(--blue); background:#EEF1FE;
    padding:4px 10px; border-radius:999px; margin-top:8px; cursor:pointer; align-self:flex-start;
  }
  .rel-chips{display:flex; flex-wrap:wrap; gap:6px; margin-top:14px}
  .rel-chips .rc{
    font-size:11.5px; color:var(--ink); background:var(--bg); border:1px solid var(--line);
    padding:4px 11px; border-radius:999px; cursor:pointer;
  }
  .mastery-dot{position:absolute; top:20px; right:20px; width:8px; height:8px; border-radius:50%}

  /* 答题按钮 */
  .actions{display:flex; gap:10px; margin-top:16px; height:52px}
  .actions .act{
    flex:1; border:none; border-radius:16px; font-size:15px; font-weight:600; cursor:pointer;
    color:#fff; transition:transform .12s, opacity .25s; font-family:inherit;
  }
  .act:active{transform:scale(.95)}
  .act.no{background:var(--red)}
  .act.mid{background:var(--amber)}
  .act.yes{background:var(--green)}
  .actions.locked .act{opacity:.25; pointer-events:none}
  .swipe-tip{text-align:center; font-size:11px; color:var(--sub); margin-top:10px}

  /* 完成面板 */
  .done-panel{
    background:var(--card); border-radius:var(--radius); border:1px solid var(--line);
    padding:32px 24px; text-align:center; box-shadow:0 12px 32px rgba(28,31,36,.06);
  }
  .done-panel .emoji{font-size:44px}
  .done-panel h2{font-size:20px; margin:10px 0 4px}
  .done-panel p{font-size:13px; color:var(--sub)}
  .done-stats{display:flex; justify-content:center; gap:26px; margin:22px 0}
  .done-stats .ds b{display:block; font-size:24px; font-family:ui-rounded,sans-serif}
  .done-stats .ds span{font-size:11px; color:var(--sub)}
  .btn-main{
    display:inline-block; border:none; background:var(--ink); color:#fff; font-size:15px;
    padding:13px 34px; border-radius:999px; cursor:pointer; font-family:inherit; margin-top:6px;
  }
  .btn-ghost{
    display:inline-block; border:1px solid var(--line); background:var(--card); color:var(--sub);
    font-size:14px; padding:12px 24px; border-radius:999px; cursor:pointer; margin:6px 0 0 8px; font-family:inherit;
  }

  /* ───── 搜索页 ───── */
  .searchbox{
    display:flex; align-items:center; gap:8px; background:var(--card); border:1px solid var(--line);
    border-radius:14px; padding:12px 14px; margin-bottom:8px;
  }
  .searchbox input{
    flex:1; border:none; outline:none; font-size:15px; background:transparent; font-family:inherit; color:var(--ink);
  }
  .searchbox svg{flex:none; opacity:.4}
  .search-hint{font-size:11.5px; color:var(--sub); padding:4px 6px 12px; line-height:1.7}
  .search-hint code{background:var(--card); padding:1px 6px; border-radius:6px; border:1px solid var(--line); font-size:11px}
  .results{display:flex; flex-direction:column; gap:8px}
  .result-row{
    background:var(--card); border:1px solid var(--line); border-radius:16px; padding:13px 16px;
    cursor:pointer; transition:transform .12s;
  }
  .result-row:active{transform:scale(.98)}
  .result-row .r1{display:flex; align-items:baseline; gap:8px}
  .result-row .rt{font-size:16px; font-weight:600}
  .result-row .ra{font-size:12px; color:var(--sub)}
  .result-row .rc2{
    margin-left:auto; font-size:10.5px; padding:2px 8px; border-radius:999px; color:#fff; flex:none;
  }
  .result-row .rp{font-size:12.5px; color:var(--sub); margin-top:5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .result-row .rh{font-size:11px; color:var(--blue); margin-top:4px}
  .empty{text-align:center; color:var(--sub); font-size:13px; padding:44px 0}
  mark{background:transparent; color:var(--red); font-weight:700}

  /* ───── 测验页 ───── */
  .quiz-card{
    background:var(--card); border-radius:var(--radius); border:1px solid var(--line);
    padding:26px 22px; box-shadow:0 12px 32px rgba(28,31,36,.06);
  }
  .quiz-prog{display:flex; align-items:center; gap:10px; margin-bottom:18px}
  .quiz-prog .track{flex:1; height:6px; border-radius:3px; background:var(--line)}
  .quiz-prog .fill{height:100%; border-radius:3px; background:var(--blue); width:0; transition:width .3s}
  .quiz-prog span{font-size:12px; color:var(--sub); flex:none}
  .quiz-q .lab{font-size:11px; color:var(--sub); letter-spacing:2px; margin-bottom:10px}
  .quiz-q .qt{font-size:17px; line-height:1.8}
  .quiz-q .qt b{color:var(--red); letter-spacing:2px}
  .quiz-opts{display:flex; flex-direction:column; gap:10px; margin-top:22px}
  .qopt{
    border:1.5px solid var(--line); background:var(--card); border-radius:14px; padding:14px 16px;
    font-size:15px; text-align:left; cursor:pointer; font-family:inherit; color:var(--ink);
    transition:all .15s; display:flex; align-items:baseline; gap:8px;
  }
  .qopt .idx{font-size:11px; color:var(--sub); flex:none}
  .qopt .oa{font-size:11.5px; color:var(--sub); margin-left:auto; flex:none}
  .qopt.right{border-color:var(--green); background:var(--green-soft)}
  .qopt.wrong{border-color:var(--red); background:var(--red-soft)}
  .qopt:disabled{cursor:default}
  .quiz-feedback{text-align:center; font-size:13px; margin-top:14px; min-height:20px; color:var(--sub)}
  .quiz-intro{text-align:center; padding:44px 24px}
  .quiz-intro .emoji{font-size:46px}
  .quiz-intro h2{font-size:20px; margin:12px 0 6px}
  .quiz-intro p{font-size:13px; color:var(--sub); line-height:1.8}

  /* ───── 掌握度页 ───── */
  .stat-hero{
    background:var(--card); border-radius:var(--radius); border:1px solid var(--line);
    padding:24px; display:flex; align-items:center; gap:22px; box-shadow:0 8px 24px rgba(28,31,36,.05);
  }
  .ring{position:relative; width:104px; height:104px; flex:none}
  .ring svg{transform:rotate(-90deg)}
  .ring .rtxt{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center}
  .ring .rtxt b{font-size:24px; font-family:ui-rounded,sans-serif}
  .ring .rtxt span{font-size:10px; color:var(--sub)}
  .stat-hero .legend{flex:1; display:flex; flex-direction:column; gap:9px}
  .legend .lg{display:flex; align-items:center; gap:8px; font-size:12.5px; color:#5B6470}
  .legend .lg i{width:9px; height:9px; border-radius:50%; flex:none}
  .legend .lg b{margin-left:auto; font-size:14px}
  .cat-progress{background:var(--card); border-radius:var(--radius); border:1px solid var(--line); padding:18px; margin-top:12px}
  .cat-progress h3{font-size:13px; margin-bottom:14px; color:#5B6470}
  .cp-row{margin-bottom:13px}
  .cp-row .cp1{display:flex; font-size:12.5px; margin-bottom:6px}
  .cp-row .cp1 b{font-weight:600}
  .cp-row .cp1 span{margin-left:auto; color:var(--sub); font-size:11.5px}
  .cp-row .track{height:7px; border-radius:4px; background:var(--bg); overflow:hidden}
  .cp-row .fill{height:100%; border-radius:4px; transition:width .5s ease}
  .word-lists{margin-top:12px}
  .wl-group{background:var(--card); border-radius:var(--radius); border:1px solid var(--line); padding:16px 18px; margin-bottom:12px}
  .wl-group h3{font-size:13px; color:#5B6470; margin-bottom:10px; display:flex; align-items:center; gap:7px}
  .wl-group h3 i{width:8px; height:8px; border-radius:50%}
  .wl-tags{display:flex; flex-wrap:wrap; gap:7px}
  .wl-tags .wt{
    font-size:12px; padding:5px 12px; border-radius:999px; cursor:pointer; border:1px solid var(--line); background:var(--bg);
  }
  .wl-tags .none{font-size:12px; color:var(--sub); padding:4px 0}
  .reset-row{text-align:center; margin-top:6px}
  .reset-row button{border:none; background:none; color:var(--sub); font-size:12px; text-decoration:underline; cursor:pointer; font-family:inherit}

  /* ───── 底部 Tab ───── */
  nav.tabbar{
    position:fixed; bottom:0; left:50%; transform:translateX(-50%); width:100%; max-width:430px;
    background:rgba(255,255,255,.92); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
    border-top:1px solid var(--line); display:flex; padding:8px 0 calc(10px + env(safe-area-inset-bottom)); z-index:50;
  }
  .tab{
    flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; cursor:pointer;
    font-size:10.5px; color:var(--sub); transition:color .15s;
  }
  .tab.on{color:var(--red)}
  .tab svg{width:23px; height:23px}

  /* ───── 底部 Sheet（词条详情）───── */
  .mask{
    position:fixed; inset:0; background:rgba(28,31,36,.42); opacity:0; pointer-events:none;
    transition:opacity .25s; z-index:90;
  }
  .mask.show{opacity:1; pointer-events:auto}
  .sheet{
    position:fixed; bottom:0; left:50%; transform:translate(-50%,105%); width:100%; max-width:430px;
    background:var(--card); border-radius:24px 24px 0 0; z-index:100; transition:transform .32s cubic-bezier(.2,.7,.3,1);
    padding:14px 22px calc(26px + env(safe-area-inset-bottom)); max-height:78vh; overflow-y:auto;
  }
  .sheet.show{transform:translate(-50%,0)}
  .sheet .grab{width:38px; height:4px; border-radius:2px; background:var(--line); margin:0 auto 16px}
  .sheet .close{position:absolute; top:16px; right:18px; font-size:13px; color:var(--sub); cursor:pointer; background:var(--bg); width:28px; height:28px; border-radius:50%; text-align:center; line-height:28px}
  .sheet-actions{display:flex; gap:10px; margin-top:20px}
  .sheet-actions .sa{
    flex:1; padding:12px 0; border-radius:13px; border:none; font-size:14px; font-weight:600;
    cursor:pointer; font-family:inherit;
  }
</style>
</head>

<script>
/* ═══════════════ 数据：Glossary.kt 全量 80 词 ═══════════════ */
const CATS = {TECHNICAL:"技术指标", VALUATION:"估值指标", MECHANISM:"交易机制", CAPITAL:"资金与情绪", FINANCIAL:"财报概念"};
const CAT_COLORS = {TECHNICAL:"#5B7CFA", VALUATION:"#8B5CF6", MECHANISM:"#E05252", CAPITAL:"#E8A13C", FINANCIAL:"#1E9E6F"};

/* k:key t:term a:ascii al:aliases c:cat p:人话 e:例子 adv:进阶 py:拼音首字母 */
const TERMS = [
{k:"MACD",t:"MACD",a:"MACD",al:["指数平滑异同平均","平滑异同移动平均线"],c:"TECHNICAL",p:"用两条均线的远近判断涨跌动力的强弱，比单看均线更早给出方向变化。",e:"茅台股价创新低但 MACD 绿柱在缩短，说明跌势在减弱，但还没到反转确认。",adv:"由 DIF（快线）与 DEA（慢线）及柱状图组成：DIF 上穿 DEA 称金叉，下穿称死叉。柱状图由正转负代表短期动能衰减。单一周期易失灵，常需与成交量、价格位置交叉验证。",py:""},
{k:"KDJ",t:"KDJ",a:"KDJ",al:["随机指标"],c:"TECHNICAL",p:"看当前价格在最近一段时间高低区间里的位置，判断是涨过头还是跌过头。",e:"短线连续上涨后 KDJ 的 J 值超过 100，通常是短期过热的提示，不宜追高。",adv:"K 为快速线、D 为慢速线，J = 3K − 2D，敏感度最高。震荡市中 K 在 20 以下回升常被视为超卖修复；单边趋势市中会长期钝化，需要配合趋势指标使用。",py:""},
{k:"RSI",t:"RSI",a:"RSI",al:["相对强弱指标"],c:"TECHNICAL",p:"把一段时间里涨的幅度和跌的幅度放在一起比，衡量买卖力量谁更强。",e:"RSI 升到 80 以上，说明这段时间买方明显占优，追进去的成本已经偏高。",adv:"常用 6 日 / 12 日 / 24 日三个周期。超过 70 一般称超买、低于 30 称超卖，但强趋势中指标会长期停留在极端区，单看阈值容易误判。",py:""},
{k:"MA",t:"均线",a:"MA",al:["移动平均线","平均线","5日线","20日线","60日线"],c:"TECHNICAL",p:"把最近若干天的收盘价平均后连成的线，用来抹平日常波动、看清方向。",e:"股价跌破 60 日均线且均线开始走平向下，中期趋势通常已经转弱。",adv:"周期越短越灵敏、越滞后小；越长越稳但反应慢。多头排列（短期均线在长期之上）与空头排列是常用的趋势判断框架，均线同时充当支撑与压力。",py:"jx"},
{k:"BOLL",t:"布林带",a:"BOLL",al:["布林线","布林通道"],c:"TECHNICAL",p:"在均线上下各画一条波动带，价格贴上轨算偏热、贴下轨算偏冷。",e:"股价沿布林上轨连续运行，说明短期偏强，但一旦开口收敛就要留意变盘。",adv:"中轨为 20 日均线，上下轨为中轨 ± 2 倍标准差。带宽收窄代表波动率压缩、常预示变盘；开口扩张代表趋势展开。",py:"bld"},
{k:"GOLDEN_CROSS",t:"金叉",a:"",al:["黄金交叉"],c:"TECHNICAL",p:"短期指标线从下往上穿过长期指标线，常被视为转强的信号。",e:"MACD 出现金叉当天成交量同步放大，信号的可靠性比缩量金叉更高。",adv:"金叉只是概率信号而非保证：零轴下方的金叉通常弱于零轴上方，震荡市中频繁出现的金叉多为噪音，需结合位置与量能过滤。",py:"jc"},
{k:"DEATH_CROSS",t:"死叉",a:"",al:["死亡交叉"],c:"TECHNICAL",p:"短期指标线从上往下穿过长期指标线，常被视为转弱的信号。",e:"高位出现死叉且跌破均线，往往比低位死叉更值得警惕。",adv:"与金叉对称，同样受位置影响：低位缩量死叉可能是最后一跌，高位放量死叉的杀伤力通常更大。",py:"sc"},
{k:"DIVERGENCE",t:"背离",a:"",al:["底背离","顶背离"],c:"TECHNICAL",p:"价格创新高（新低）而指标没有跟上，暗示当前趋势的动力在减弱。",e:"股价创阶段新低但 MACD 低点反而抬高，这种底背离常被解读为跌势衰竭。",adv:"背离可以持续很久，属于「预警」而非「拐点确认」；需要价格结构（如突破前高）与量能配合才算被验证。",py:"bl"},
{k:"TURNOVER",t:"换手率",a:"HSL",al:["换手"],c:"TECHNICAL",p:"当天成交的股票占流通股的比例，衡量这只票今天有多热。",e:"换手率从 1% 突然放大到 15%，通常意味着有大资金进场或离场。",adv:"不同市值区间的合理换手率差异很大：大盘蓝筹 1%-3% 属常态，小盘题材股 10% 以上才显活跃。需与历史分位而非绝对值比较。",py:"hsl"},
{k:"VOLUME_RATIO",t:"量比",a:"",al:["量比值"],c:"TECHNICAL",p:"当前每分钟成交量与过去五天同期的比值，看今天是不是突然放量。",e:"开盘量比超过 3，说明早盘资金关注度明显提升。",adv:"量比随时间衰减：开盘半小时的量比天然偏高，尾盘的意义有限，通常配合分时均价线一起看。",py:"lb"},
{k:"QFQ",t:"前复权",a:"",al:["复权"],c:"TECHNICAL",p:"把历史价格按分红送股倒推调整，让 K 线在除权前后连得上。",e:"看长期走势一定要用前复权，否则除权当天会出现假的暴跌缺口。",adv:"前复权以最新价为基准回推历史价，适合看长期趋势；后复权以最早价为基准前推，适合看真实累计收益；不复权保留原始成交价。",py:"qfq"},
{k:"HFQ",t:"后复权",a:"",al:[],c:"TECHNICAL",p:"以最早的价格为基准往前推，保留你真实拿到手的累计涨幅。",e:"十年长牛股用后复权看，涨幅往往比前复权数字更惊人，因为把分红送股都算进去了。",adv:"后复权把分红、送股等收益累计到后续价格中，适合衡量长期持有的总回报，但价格不对应当时真实成交价。",py:"hfq"},
{k:"SUPPORT",t:"支撑位",a:"",al:["支撑区"],c:"TECHNICAL",p:"股价下跌时比较容易止跌的位置，通常来自前期的密集成交区。",e:"股价三次回踩 60 日均线都没跌破，这条均线就是短期的支撑位。",adv:"支撑与压力会互相转换：一旦有效跌破，原支撑往往变成后续反弹的压力。有效性取决于成交量与停留时间，而非精确点位。",py:"zcw"},
{k:"RESISTANCE",t:"压力位",a:"",al:["阻力位"],c:"TECHNICAL",p:"股价上涨时比较难突破的位置，上方套牢盘多在此聚集。",e:"股价逼近前期高点却连续放量滞涨，说明上方压力位抛压较重。",adv:"压力位是成交密集区而非精确价格；放量有效突破后，原压力常会转为回踩支撑，缩量假突破则更容易回落。",py:"ylw"},
{k:"GAP",t:"缺口",a:"",al:["跳空","跳空缺口"],c:"TECHNICAL",p:"今天的最低价高于昨天的最高价（或相反），K 线之间出现的空白。",e:"业绩预增后一字涨停形成跳空缺口，通常代表消息面的强烈预期。",adv:"分突破缺口、持续缺口与衰竭缺口；缺口回补与否取决于是否伴随量能。A 股一字板形成的缺口短期多不回补。",py:"qk"},
{k:"AMPLITUDE",t:"振幅",a:"",al:[],c:"TECHNICAL",p:"当天最高价与最低价的差距，衡量这只票今天波动有多大。",e:"振幅 12% 说明多空分歧极大，持仓体验会很颠簸。",adv:"振幅通常按（最高价－最低价）÷昨收价计算；高位放量大振幅常代表分歧加剧，低位则需结合换手与趋势判断。",py:"zf"},
{k:"STD_DEV",t:"标准差",a:"",al:["均方差"],c:"TECHNICAL",p:"衡量一组数字离平均有多散。日收益的标准差大 = 这只票上蹿下跳得厉害。",e:"A 股日波动标准差 1%，B 股 3%，同样的行情下 B 的过山车幅度大约是 A 的三倍。",adv:"日标准差 × √250 可粗略年化。它衡量的是波动幅度本身，不分涨跌方向——大涨大跌都会推高标准差。",py:"bzc"},
{k:"VOLATILITY",t:"波动率",a:"VOL",al:["波动性"],c:"TECHNICAL",p:"价格波动剧烈程度的指标，通常由日收益标准差年化而来，越高越颠簸。",e:"说某票「波动率是大盘两倍」，意思是它每天的起伏幅度大约是大盘的两倍。",adv:"常指年化历史波动率 = 日收益标准差 × √250。另有期权隐含波动率（IV），反映市场对未来波动的预期，与历史波动率不同。",py:"bdl"},
{k:"CORRELATION",t:"相关系数",a:"r",al:["相关性","相关度"],c:"TECHNICAL",p:"两个标的涨跌步调有多一致，从 -1 到 +1。越接近 1 越同步，接近 0 各走各的。",e:"两只白酒股相关系数 0.9，同涨同跌；白酒股和银行股 0.3，一起拿才算分散。",adv:"常用日收益率的 Pearson 相关系数。注意：相关性不稳定，行情剧变时会快速抬升——「平时不同步、危机时齐跌」是常见现象。",py:"xgxs"},
{k:"BETA",t:"贝塔",a:"β",al:["贝塔系数","Beta"],c:"TECHNICAL",p:"个股跟着大盘涨跌的放大倍数。贝塔 1.5 = 大盘涨 1% 它平均涨 1.5%，跌时也放大。",e:"券商股贝塔普遍高，牛市里弹性大；公用事业股贝塔低，大盘怎么走它都波澜不惊。",adv:"由个股对指数收益做回归得到，= 相关系数 × (个股波动率 / 指数波动率)。贝塔高不代表能赚钱，只代表对大盘的敏感度高。",py:"bt"},
{k:"ALPHA",t:"阿尔法",a:"α",al:["阿尔法收益","超额收益"],c:"TECHNICAL",p:"扣掉大盘带来的部分后，你自己多赚（或多亏）的那部分。",e:"大盘涨 10%，你的组合涨 13%，多出的 3% 就近似你的阿尔法——正负才是本事，跟着大盘的部分不是。",adv:"严格定义来自 CAPM 回归的截距项。散户场景下用「组合收益 − 贝塔 × 指数收益」估算即可，注意成本与运气成分。",py:"aef"},
{k:"SHARPE",t:"夏普比率",a:"Sharpe",al:["夏普指数","夏普值"],c:"TECHNICAL",p:"每承受一份波动换来多少超额收益，是衡量「赚得稳不稳」的常用比例。",e:"两个组合都年赚 15%，一个睡得着觉（低波动）一个天天过山车，夏普比率会把前者算得更高。",adv:"夏普 = (收益 − 无风险利率) / 收益标准差。比较时要在相似周期与标的类型间进行；短周期高夏普常是运气或杠杆的产物。",py:"xpbl"},
{k:"MAX_DRAWDOWN",t:"最大回撤",a:"",al:["回撤"],c:"TECHNICAL",p:"从阶段最高点跌到最低点的最大幅度，衡量最疼的时候有多疼。",e:"净值从 1.5 跌到 1.2，最大回撤 20%——问问自己能不能扛住，再决定要不要这样的组合。",adv:"回撤 = (峰值 − 谷值) / 峰值。注意两点：回撤 50% 需要涨 100% 才能回本，亏损与回本不对称；它只描述历史最差一段，不预测未来最大跌幅。",py:"zdhc"},

{k:"PE",t:"市盈率",a:"PE",al:["本益比","PE_TTM"],c:"VALUATION",p:"股价除以每股收益，粗略理解成「按当前盈利多少年回本」。",e:"同为 30 倍市盈率，高增长的科技股和成熟的银行股，含义完全不同。",adv:"静态 PE 用去年年报、TTM 用最近四个季度、动态 PE 用预测盈利，口径不同数值差异很大。亏损企业 PE 为负，此时应改用 PS 或现金流口径。",py:"syl"},
{k:"PB",t:"市净率",a:"PB",al:[],c:"VALUATION",p:"股价除以每股净资产，看的是你为公司账面的家底付了多少钱。",e:"破净（PB 小于 1）在银行股中常见，但不等于一定便宜。",adv:"重资产行业（银行、地产、钢铁）更适用 PB；轻资产公司的核心资产是人和品牌，账面净资产参考价值有限。",py:"sjl"},
{k:"PS",t:"市销率",a:"PS",al:[],c:"VALUATION",p:"市值除以营业收入，给还没赚钱但收入增长快的公司估值。",e:"创新药公司常年亏损，用 PE 没法比，常用市销率横向比较。",adv:"",py:"sxsl"},
{k:"PEG",t:"PEG",a:"PEG",al:["市盈率相对盈利增长比率"],c:"VALUATION",p:"市盈率除以盈利增速，把「贵不贵」和「长得快不快」放在一起看。",e:"30 倍 PE 配 30% 增速，PEG 约等于 1，通常被认为估值与增长匹配。",adv:"增速为负时 PEG 无意义；用未来预期增速计算会引入预测误差，敏感性很高，建议做多情景测算。",py:""},
{k:"EPS",t:"每股收益",a:"EPS",al:[],c:"VALUATION",p:"公司净利润摊到每一股上有多少，是算市盈率的分母。",e:"每股收益从 1 元涨到 1.5 元，若股价不变，市盈率会自然下降。",adv:"",py:"mgsy"},
{k:"ROE",t:"净资产收益率",a:"ROE",al:[],c:"VALUATION",p:"公司用股东的钱一年能赚回多少比例，长期看是衡量赚钱能力的核心指标。",e:"连续十年 ROE 超过 20% 的消费龙头，通常具备很强的品牌护城河。",adv:"可用杜邦分析拆为净利率 × 资产周转率 × 权益乘数，高 ROE 若来自高杠杆，风险显著高于来自高净利率的情形。",py:"jzcsyl"},
{k:"DIVIDEND_YIELD",t:"股息率",a:"",al:["分红率"],c:"VALUATION",p:"一年分的现金红利除以股价，相当于这只股票的「利息」。",e:"股息率 5% 的银行股，在低利率环境下对长期资金有吸引力。",adv:"需区分静态（去年分红 / 现价）与预期（今年预计分红 / 现价）；一次性特别分红会虚高静态股息率。",py:"gxl"},
{k:"MARKET_CAP",t:"总市值",a:"",al:["市值"],c:"VALUATION",p:"股价乘以总股本，也就是市场给这家公司开的总价。",e:"总市值 2 万亿的公司上涨 1%，需要的资金量远大于小盘股。",adv:"",py:"zsz"},
{k:"FLOAT_MARKET_CAP",t:"流通市值",a:"",al:["流通盘"],c:"VALUATION",p:"按实际能在市场上买卖的股票算出来的市值，更贴近真实交易规模。",e:"流通市值小意味着少量资金就能拉动股价，波动通常更大。",adv:"",py:"ltsz"},
{k:"VALUATION_PERCENTILE",t:"估值分位",a:"",al:["历史分位","估值百分位"],c:"VALUATION",p:"当前估值在自己历史区间里所处的位置，用来判断相对高低。",e:"市盈率处于近十年 20% 分位，说明比过去八成的时间都便宜。",adv:"分位数依赖样本区间与公司自身的经营周期，若基本面发生结构性变化（如主营业务转型），历史分位的参考性会下降。",py:"gzfw"},
{k:"RISK_PREMIUM",t:"风险溢价",a:"",al:["股权风险溢价"],c:"VALUATION",p:"承担风险比把钱存银行应该多赚的部分。市场给的不确定性补偿。",e:"无风险利率 2%、股市长期回报约 8%，中间约 6% 就是风险溢价——它是对承担波动的报酬，不是保证。",adv:"",py:"fxyj"},

{k:"CALL_AUCTION",t:"集合竞价",a:"",al:["竞价"],c:"MECHANISM",p:"开盘和收盘前几分钟集中撮合买卖单，一次性定出成交价。",e:"集合竞价高开 3%，通常反映隔夜消息的乐观预期。",adv:"",py:"jhjj"},

{k:"EX_RIGHTS",t:"除权除息",a:"",al:["除权","除息","XR","DR"],c:"MECHANISM",p:"分红送股后按比例调低股价，账面上看似下跌，实际资产并没有减少。",e:"10 送 10 后股价从 20 元变成 10 元，你手上的股票数量翻倍，总资产不变。",adv:"",py:"cqcx"},
{k:"IPO_SUBSCRIPTION",t:"打新",a:"",al:["新股申购","申购新股"],c:"MECHANISM",p:"在新股上市前按发行价申购，中签后通常在上市初期卖出。",e:"科创板打新需要对应的市值底仓，不是有钱就能参与。",adv:"",py:"dx"},
{k:"BLOCK_TRADE",t:"大宗交易",a:"",al:["大宗"],c:"MECHANISM",p:"买卖双方在场外协商的大额交易，不进入集合竞价撮合。",e:"大股东通过大宗交易减持，接盘方通常有 6 个月锁定期。",adv:"",py:"dzjy"},

{k:"POSITION",t:"仓位",a:"",al:["持仓比例","轻仓","重仓"],c:"MECHANISM",p:"你投进股市的钱占可用资金的比例，几成仓就是说投了百分之几十。",e:"「半仓」= 一半资金买了股票，剩下一半还是现金，跌了还有钱补，涨了也不踏空。",adv:"",py:"cw"},

{k:"REBALANCE",t:"再平衡",a:"",al:["调仓再平衡"],c:"MECHANISM",p:"定期把涨大了、占比变高的部分卖一些，买回占比变低的，恢复原来的分配。",e:"原定股票各占一半，股票涨到七成后卖出一部分买回另一边，涨的落袋、跌的补位。",adv:"",py:"zph"},

{k:"NORTHBOUND",t:"北向资金",a:"",al:["北上资金","陆股通"],c:"CAPITAL",p:"通过沪深港通从香港流入 A 股的资金，常被当作外资态度的风向标。",e:"北向资金连续净买入消费龙头，往往被解读为外资看好。",adv:"北向资金中混杂着借道的外资与内资，且每日只公布成交额前十大个股，单日数据噪音大，宜看趋势而非单日。",py:"bxzj"},

/* ═══════════════ 掌握状态（localStorage 持久化） ═══════════════
   s: 0=新词 1=模糊(待巩固) 2=已掌握 3=没记住 */
const LS_KEY = "sc_term_states_v1";
const LS_TODAY = "sc_term_today_v1";
let states = {};
try{ states = JSON.parse(localStorage.getItem(LS_KEY)||"{}"); }catch(e){ states = {}; }
function sOf(k){ return (states[k]&&states[k].s) || 0; }
function setS(k,s){
  states[k] = {s, ts: Date.now()};
  localStorage.setItem(LS_KEY, JSON.stringify(states));
  bumpToday(s);
}
function bumpToday(s){
  const d = new Date(); const ds = d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate();
  let t; try{ t = JSON.parse(localStorage.getItem(LS_TODAY)||"{}"); }catch(e){ t={}; }
  if(t.d!==ds) t = {d:ds, n:0, m:0};
  t.n++; if(s===2) t.m++;
  localStorage.setItem(LS_TODAY, JSON.stringify(t));
  document.getElementById("todayNum").textContent = t.n;
}

/* ═══════════════ 学习：分类筛选 + 卡片队列 ═══════════════ */
let curCat = "ALL";
let queue = [];            // 本轮待学 key 队列
let seenThisRound = {};    // key → 本轮见过的次数
let session = {answered:0, direct:0, maxStreak:0, streak:0};

function renderChips(){
  const box = document.getElementById("catChips");
  const all = [["ALL",`全部 · ${TERMS.length}`]].concat(Object.entries(CATS).map(([c,l])=>[c,`${l} · ${TERMS.filter(t=>t.c===c).length}`]));
  box.innerHTML = all.map(([c,l])=>`<div class="chip ${c===curCat?"on":""}" onclick="pickCat('${c}')">${l}</div>`).join("");
}
function pickCat(c){
  curCat = c; renderChips(); startRound();
}
function pool(){
  return TERMS.filter(t=>curCat==="ALL"||t.c===curCat);
}
function buildQueue(){
  const p = includeMastered ? pool() : pool().filter(t=>sOf(t.k)!==2);
  const unknown = p.filter(t=>sOf(t.k)===3).map(t=>t.k);
  const fuzzy   = p.filter(t=>sOf(t.k)===1).map(t=>t.k);
  const fresh   = p.filter(t=>sOf(t.k)===0).map(t=>t.k);
  return shuffle(unknown).concat(shuffle(fuzzy), shuffle(fresh));
}
let includeMastered = false;
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function startRound(inc){
  includeMastered = !!inc;
  queue = buildQueue();
  seenThisRound = {};
  session = {answered:0, direct:0, maxStreak:0, streak:0};
  appendedOnce = {};
  roundDone = false;
  carIndex = 0;
  document.getElementById("carViewport").innerHTML = `<div class="car-track" id="carTrack"></div>`;
  updateLearnbar();
  if(queue.length===0){ renderDone(); return; }
  buildCarousel();
}
function totalRound(){ return queue.length + session.answered; }
function updateLearnbar(){
  const total = Math.max(totalRound(),1);
  document.getElementById("learnFill").style.width = (session.answered/total*100)+"%";
  document.getElementById("learnNum").textContent = `${session.answered} / ${total}`;
  const st = document.getElementById("streakTag");
  st.textContent = `🔥 连中 ${session.streak}`;
  st.classList.toggle("show", session.streak>=2);
}

function masteryColor(s){ return s===2?"#1E9E6F":s===1?"#E8A13C":s===3?"#E05252":"#D3D7DE"; }

function relatedOf(key){
  const self = byKey[key];
  const linked = Array.from(new Set([...(dependents[key]||[]), ...(PREREQ[key]||[])]));
  const same = TERMS.filter(t=>t.c===self.c && t.k!==key && !linked.includes(t.k)).map(t=>t.k);
  return linked.concat(same).slice(0,3).map(k=>byKey[k]);
}

/* ─── 轮播：翻页由拖拽距离 + 甩动速度共同决定；居中的卡片自动展开详情 ─── */
let carIndex = 0;
let appendedOnce = {};
let roundDone = false;
let drag = null;        // {dx, active, card}
let dragAxis = null;    // "x" | "y" | null

function carStep(){
  const first = document.querySelector("#carTrack .car-card");
  return (first ? first.offsetWidth : 300) + 14;
}
function cardHTML(key){
  const t = byKey[key];
  const color = CAT_COLORS[t.c];
  const pres = (PREREQ[t.k]||[]).map(k=>`<span class="pc" onclick="jumpTo('${k}')">先懂：${esc(byKey[k].t)}</span>`).join("");
  const rel = relatedOf(t.k).map(r=>`<span class="rc" onclick="jumpTo('${r.k}')">${esc(r.t)}</span>`).join("");
  const advBlock = t.adv ? `<div class="adv-toggle" onclick="toggleAdv(this)">进阶解释 ▾</div><div class="adv">${esc(t.adv)}</div>` : "";
  return `<div class="car-card" data-k="${t.k}">
    <span class="cat-tag" style="background:${color}">${CATS[t.c]}</span>
    <span class="mastery-dot" style="background:${masteryColor(sOf(t.k))}"></span>
    <div class="cc-front">
      <div class="term-big">${esc(t.t)}</div>
      ${t.a?`<div class="term-ascii">${esc(t.a)}</div>`:""}
      ${t.al.length?`<div class="term-alias">又叫：${t.al.map(esc).join(" · ")}</div>`:""}
      ${pres?`<div class="pre-chips">${pres}</div>`:""}
    </div>
    <div class="cc-detail">
      <div class="term-line">${esc(t.t)}${t.a?` <span style="font-size:13px;color:var(--sub);font-weight:400">${esc(t.a)}</span>`:""}</div>
      <div class="sec"><div class="lab">人话解释</div><div class="plain">${esc(t.p)}</div></div>
      <div class="sec"><div class="lab">A 股语境例子</div><div class="example">${esc(t.e)}</div></div>
      <div class="sec">${advBlock}</div>
      <div class="rel-chips"><span style="font-size:11px;color:var(--sub);align-self:center">接下来：</span>${rel}</div>
    </div>
  </div>`;
}
/* 摆位：off=0 的卡片居中并展开；拖拽中 near<0.5 的卡片实时放大展开 */
function layout(animate){
  const track = document.getElementById("carTrack");
  if(!track) return;
  const cards = [...track.children];
  if(!cards.length) return;
  const W = document.getElementById("carViewport").clientWidth;
  const cardW = cards[0].offsetWidth;
  const step = carStep();
  const base = (drag && drag.active) ? drag.dx : 0;
  track.classList.toggle("dragging", !animate);
  cards.forEach((el,i)=>{
    const off = (i-carIndex)*step + base;
    const near = Math.min(Math.abs(off)/step, 1);   // 0=居中 1=相邻开外
    el.dataset.i = i;
    el.classList.toggle("sel", near < 0.5);
    el.style.transform = `translate(${W/2-cardW/2+off}px, ${near*16}px) scale(${0.88+0.12*(1-near)})`;
    el.style.opacity = Math.abs(off) > step*1.7 ? 0 : (0.45 + 0.55*(1-near));
    el.style.zIndex = 100 - Math.round(Math.abs(off));
  });
}
function settle(){
  layout(false);
  requestAnimationFrame(()=>{
    const t = document.getElementById("carTrack");
    if(t) t.classList.remove("dragging");
  });
}
function buildCarousel(){
  const track = document.getElementById("carTrack");
  if(!track) return;
  track.innerHTML = queue.map(cardHTML).join("");
  settle();
  updateLearnbar();
}
function bindCarousel(){
  const vp = document.getElementById("carViewport");
  let sx=0, sy=0, dx=0, samples=[];
  vp.addEventListener("pointerdown", e=>{
    if(e.target.closest(".adv-toggle,.rc,.pc,button,.done-panel")) return; // 卡内可点元素不触发拖拽
    dragAxis = null; sx=e.clientX; sy=e.clientY; dx=0;
    samples = [[performance.now(), e.clientX]];
    drag = {dx:0, active:true, card: e.target.closest(".car-card")};
    try{ vp.setPointerCapture(e.pointerId); }catch(_){}
  });
  vp.addEventListener("pointermove", e=>{
    if(!drag || !drag.active) return;
    const mx = e.clientX - sx, my = e.clientY - sy;
    if(!dragAxis){
      if(Math.abs(mx)>7 || Math.abs(my)>7) dragAxis = Math.abs(mx)>Math.abs(my) ? "x" : "y";
      else return;
    }
    if(dragAxis==="y"){ drag.active=false; layout(true); return; }  // 纵向让位给卡内滚动
    dx = mx; drag.dx = dx;
    samples.push([performance.now(), e.clientX]);
    if(samples.length>6) samples.shift();
    layout(false);
  });
  const finish = e=>{
    if(!drag) return;
    const wasDragX = drag.active && dragAxis==="x";
    const wasTap = dragAxis===null;
    const tapCard = drag.card;
    drag = null; dragAxis = null;
    const track = document.getElementById("carTrack");
    if(!track || !track.children.length) return;
    if(wasDragX){
      /* 甩动速度：取最近 ~90ms 的平均速度，位移 + 惯性外推共同决定翻几页 */
      const now = performance.now();
      let v = 0;
      const baseS = samples.find(s=>now-s[0]<=90);
      if(baseS){
        const dt = now - baseS[0];
        if(dt>0) v = (e.clientX - baseS[1]) / dt;   // px/ms
      }
      const step = carStep();
      const proj = dx + v*160;
      let steps = -Math.round(proj/step);
      if(steps===0 && Math.abs(dx) > step*0.3) steps = dx<0 ? 1 : -1;
      carIndex = Math.max(0, Math.min(queue.length-1, carIndex + steps));
    } else if(wasTap && tapCard){
      const i = +tapCard.dataset.i;
      if(!isNaN(i) && i!==carIndex) carIndex = i;   // 轻点两侧卡片 → 居中
    }
    layout(true);
  };
  vp.addEventListener("pointerup", finish);
  vp.addEventListener("pointercancel", finish);
}
function toggleAdv(btn){
  const body = btn.nextElementSibling;
  body.classList.toggle("open");
  btn.textContent = body.classList.contains("open") ? "收起进阶 ▴" : "进阶解释 ▾";
}
function jumpTo(key){
  if(!queue.length) return;
  let i = queue.indexOf(key);
  if(i === -1){
    queue.splice(carIndex+1, 0, key);
    const track = document.getElementById("carTrack");
    const cur = track && track.children[carIndex];
    if(cur) cur.insertAdjacentHTML("afterend", cardHTML(key));
    i = carIndex + 1;
  }
  carIndex = i;
  settle();
}

/* 答题：3=不认识 1=模糊 2=会了。作答后自动滑到下一张 */
function answer(s){
  if(roundDone || !queue.length || carIndex>=queue.length) return;
  const key = queue[carIndex];
  seenThisRound[key] = (seenThisRound[key]||0) + 1;
  const firstTime = seenThisRound[key]===1;
  if(firstTime && s===2) session.direct++;
  session.answered++;
  if(s===2){ session.streak++; session.maxStreak=Math.max(session.maxStreak,session.streak); }
  else session.streak=0;
  setS(key, s);
  refreshDot(key);
  if(s!==2 && !appendedOnce[key]){   // 没记住的词追加到队尾，再过一遍
    appendedOnce[key] = 1;
    queue.push(key);
    const track = document.getElementById("carTrack");
    if(track){
      track.insertAdjacentHTML("beforeend", cardHTML(key));
      layout(false);
      requestAnimationFrame(()=>{ track.classList.remove("dragging"); });
    }
  }
  updateLearnbar();
  if(carIndex < queue.length-1){ carIndex++; layout(true); }
  else renderDone();
}
function refreshDot(key){
  const dot = document.querySelector(`.car-card[data-k="${key}"] .mastery-dot`);
  if(dot) dot.style.background = masteryColor(sOf(key));
}

function renderDone(){
  roundDone = true;
  const poolLeft = pool().filter(t=>sOf(t.k)!==2).length;
  document.getElementById("carViewport").innerHTML = `
    <div class="done-panel">
      <div class="emoji">${session.maxStreak>=5?"🏆":session.maxStreak>=3?"🎉":"💪"}</div>
      <h2>本轮学完了</h2>
      <p>${curCat==="ALL"?"全部词库":CATS[curCat]} · 没记住的词已自动排入下一轮</p>
      <div class="done-stats">
        <div class="ds"><b>${session.answered}</b><span>作答张数</span></div>
        <div class="ds"><b>${session.direct}</b><span>一次记会</span></div>
        <div class="ds"><b>${session.maxStreak}</b><span>最高连中</span></div>
      </div>
      ${poolLeft?`<button class="btn-main" onclick="startRound()">继续学剩余 ${poolLeft} 张</button>`
                :`<button class="btn-main" onclick="startRound(true)">全部掌握！再过一遍</button>`}
      <button class="btn-ghost" onclick="pickCat(pickNextCat())">换个分类</button>
    </div>`;
}
function pickNextCat(){
  const cats = ["ALL"].concat(Object.keys(CATS));
  const i = cats.indexOf(curCat);
  return cats[(i+1)%cats.length];
}

/* ═══════════════ 搜索（移植 Glossary.search 分级打分） ═══════════════ */
function searchTerms(qraw){
  const q = qraw.trim().toUpperCase();
  if(!q) return [];
  const res = [];
  for(const t of TERMS){
    const hay = (t.t+" "+(t.a||"")+" "+t.al.join(" ")).toUpperCase();
    const ini = (t.py||"").toUpperCase();
    let s = -1;
    if(t.t.toUpperCase()===q) s=100;
    else if((t.a||"").toUpperCase()===q) s=95;
    else if(t.al.some(a=>a.toUpperCase()===q)) s=90;
    else if(ini && ini===q) s=88;
    else if(t.t.toUpperCase().startsWith(q)) s=80;
    else if((t.a||"").toUpperCase().startsWith(q)) s=75;
    else if(ini && ini.startsWith(q)) s=72;
    else if(hay.includes(q)) s=60;
    if(s>=0) res.push([s,t]);
  }
  res.sort((x,y)=>y[0]-x[0] || x[1].k.localeCompare(y[1].k));
  return res.map(r=>r[1]);
}
function hl(text, q){
  const i = text.toUpperCase().indexOf(q.toUpperCase());
  if(i<0 || !q) return esc(text);
  return esc(text.slice(0,i))+"<mark>"+esc(text.slice(i,i+q.length))+"</mark>"+esc(text.slice(i+q.length));
}
document.getElementById("searchInput").addEventListener("input", e=>{
  const q = e.target.value;
  const box = document.getElementById("searchResults");
  if(!q.trim()){ box.innerHTML = `<div class="empty">输入关键词开始检索，或点任意掌握度页的词查看详情</div>`; return; }
  const hits = searchTerms(q).slice(0,30);
  if(!hits.length){ box.innerHTML = `<div class="empty">没有找到「${esc(q)}」相关的术语</div>`; return; }
  box.innerHTML = hits.map(t=>{
    /* 命中提示：若正名/缩写没直接命中，找出命中的别名 */
    let hitLine = "";
    const fields = t.al.concat([]);
    const aliasHit = fields.find(a=>a.toUpperCase().includes(q.toUpperCase()));
    const pyHit = !aliasHit && (t.py||"").toUpperCase().startsWith(q.toUpperCase()) ? t.py : "";
    if(!t.t.toUpperCase().includes(q.toUpperCase()) && !(t.a||"").toUpperCase().includes(q.toUpperCase())){
      if(aliasHit) hitLine = `<div class="rh">命中别名：${hl(aliasHit,q)}</div>`;
      else if(pyHit) hitLine = `<div class="rh">命中拼音首字母：${esc(pyHit)}</div>`;
    }
    return `<div class="result-row" onclick="openSheet('${t.k}')">
      <div class="r1">
        <span class="rt">${hl(t.t,q)}</span>
        ${t.a?`<span class="ra">${hl(t.a,q)}</span>`:""}
        <span class="rc2" style="background:${CAT_COLORS[t.c]}">${CATS[t.c]}</span>
      </div>
      <div class="rp">${esc(t.p)}</div>
      ${hitLine}
    </div>`;
  }).join("");
});

/* ═══════════════ 词条详情 Sheet ═══════════════ */

/* ═══════════════ 测验 ═══════════════ */
let quiz = null;
function renderQuizIntro(){
  const learned = TERMS.filter(t=>sOf(t.k)>0).length;
  document.getElementById("quizBody").innerHTML = `
    <div class="quiz-card quiz-intro">
      <div class="emoji">🎯</div>

      <div style="margin-top:20px">

        <button class="btn-ghost" onclick="startQuiz(false)">随机 10 题</button>
      </div>
      ${learned<4?`<p style="margin-top:12px;color:var(--amber)">学过的词还不足 4 个，先去「学习」页刷几张卡片吧</p>`:""}
    </div>`;
}
function blankOut(t){
  const forms = [t.t, t.a].concat(t.al).filter(f=>f && f.length>=2).sort((a,b)=>b.length-a.length);
  let s = t.p;
  for(const f of forms){ s = s.split(f).join("「____」"); }
  return s;
}
function startQuiz(learnedOnly){
  let poolq = learnedOnly ? TERMS.filter(t=>sOf(t.k)>0) : TERMS.slice();
  if(poolq.length<4) poolq = TERMS.slice();
  poolq = shuffle(poolq).slice(0,10);
  quiz = {qs: poolq.map(t=>{
    const distractors = shuffle(TERMS.filter(x=>x.c===t.c && x.k!==t.k)).slice(0,3);
    const fallback = shuffle(TERMS.filter(x=>x.k!==t.k)).slice(0,3);
    const opts = shuffle([t].concat(distractors.length===3?distractors:fallback));
    return {t, opts};
  }), i:0, right:0, wrongKeys:[]};
  renderQuizQ();
}
function renderQuizQ(){
  const {qs,i} = quiz;
  if(i>=qs.length){ renderQuizDone(); return; }
  const {t,opts} = qs[i];
  document.getElementById("quizBody").innerHTML = `
    <div class="quiz-card">
      <div class="quiz-prog"><div class="track"><div class="fill" style="width:${i/qs.length*100}%"></div></div><span>${i+1} / ${qs.length}</span></div>
      <div class="quiz-q">
        <div class="lab">这是哪个术语的意思？</div>
        <div class="qt">${esc(blankOut(t))}</div>
      </div>
      <div class="quiz-opts" id="qopts">
        ${opts.map((o,j)=>`<button class="qopt" onclick="pickOpt(${j})"><span class="idx">${"ABCD"[j]}</span>${esc(o.t)}${o.a?`<span class="oa">${esc(o.a)}</span>`:""}</button>`).join("")}
      </div>
      <div class="quiz-feedback" id="qfb"></div>
    </div>`;
}
function pickOpt(j){
  const {qs,i} = quiz; const {t,opts} = qs[i];
  const pick = opts[j];
  const btns = document.querySelectorAll(".qopt");
  btns.forEach((b,idx)=>{
    b.disabled = true;
    if(opts[idx].k===t.k) b.classList.add("right");
    else if(idx===j) b.classList.add("wrong");
  });
  if(pick.k===t.k){ quiz.right++; document.getElementById("qfb").textContent = "✓ 答对了"; }
  else{
    quiz.wrongKeys.push(t.k);
    document.getElementById("qfb").textContent = "✗ 正确答案：" + t.t + "，已标记为「待巩固」";
  }
  quiz.i++;
  setTimeout(renderQuizQ, 900);
}
function renderQuizDone(){
  const n = quiz.qs.length, r = quiz.right;
  const emoji = r>=9?"🏆":r>=7?"🎉":r>=5?"👍":"📖";
  document.getElementById("quizBody").innerHTML = `
    <div class="quiz-card quiz-intro">
      <div class="emoji">${emoji}</div>
      <h2>${r} / ${n}</h2>
      <p>${r>=9?"几乎全对，可以考虑解锁新分类了":r>=7?"不错，错词已标为待巩固，下一轮卡片会重点出现":r>=5?"及格线上，把错词回去再刷两遍":"建议先去「学习」页过一遍卡片再来"}</p>
      <div style="margin-top:18px">
        <button class="btn-main" onclick="startQuiz(${quiz.wrongKeys.length>n/2?"false":"true"})">再来一轮</button>
        <button class="btn-ghost" onclick="renderQuizIntro()">返回</button>
      </div>
    </div>`;
  quiz.wrongKeys.forEach(k=>{ if(sOf(k)<2) setS(k, Math.max(sOf(k),1)); });
}

/* ═══════════════ 掌握度 ═══════════════ */
function renderStats(){
  const total = TERMS.length;
  const cnt = {0:0,1:0,2:0,3:0};
  TERMS.forEach(t=>cnt[sOf(t.k)]++);
  const mastered = cnt[2];
  const pct = Math.round(mastered/total*100);
  const C = 2*Math.PI*46;
  document.getElementById("statHero").innerHTML = `
    <div class="ring">
      <svg width="104" height="104">
        <circle cx="52" cy="52" r="46" fill="none" stroke="#ECEEF2" stroke-width="9"/>
        <circle cx="52" cy="52" r="46" fill="none" stroke="#1E9E6F" stroke-width="9" stroke-linecap="round"
          stroke-dasharray="${C}" stroke-dashoffset="${C*(1-mastered/total)}" style="transition:stroke-dashoffset .6s"/>
      </svg>
      <div class="rtxt"><b>${pct}%</b><span>已掌握</span></div>
    </div>
    <div class="legend">
      <div class="lg"><i style="background:#D3D7DE"></i>新词<b>${cnt[0]}</b></div>
      <div class="lg"><i style="background:#E8A13C"></i>待巩固<b>${cnt[1]}</b></div>
      <div class="lg"><i style="background:#1E9E6F"></i>已掌握<b>${cnt[2]}</b></div>
      <div class="lg"><i style="background:#E05252"></i>没记住<b>${cnt[3]}</b></div>
    </div>`;
  document.getElementById("catProgress").innerHTML = Object.entries(CATS).map(([c,label])=>{
    const list = TERMS.filter(t=>t.c===c);
    const m = list.filter(t=>sOf(t.k)===2).length;
    return `<div class="cp-row">
      <div class="cp1"><b>${label}</b><span>${m} / ${list.length}</span></div>
      <div class="track"><div class="fill" style="width:${m/list.length*100}%;background:${CAT_COLORS[c]}"></div></div>
    </div>`;
  }).join("");
  const group = (title,color,list)=>`
    <div class="wl-group">
      <h3><i style="background:${color}"></i>${title}（${list.length}）</h3>
      <div class="wl-tags">${list.length?list.map(t=>`<span class="wt" onclick="openSheet('${t.k}')">${esc(t.t)}</span>`).join(""):`<span class="none">还没有 · 继续加油</span>`}</div>
    </div>`;
  document.getElementById("wordLists").innerHTML =
    group("没记住","#E05252",TERMS.filter(t=>sOf(t.k)===3)) +
    group("待巩固","#E8A13C",TERMS.filter(t=>sOf(t.k)===1)) +
    group("已掌握","#1E9E6F",TERMS.filter(t=>sOf(t.k)===2));
}
function resetAll(){
  if(!confirm("确定清空全部学习记录吗？所有词条会回到「新词」状态。")) return;
  if(!confirm("再次确认：此操作不可撤销。")) return;
  states = {}; localStorage.removeItem(LS_KEY); localStorage.removeItem(LS_TODAY);
  document.getElementById("todayNum").textContent = 0;
  renderStats(); startRound();
}

/* ═══════════════ 工具 ═══════════════ */
function esc(s){ return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

/* 启动 */
renderChips();
bindCarousel();
startRound();
renderQuizIntro();
window.addEventListener("resize", ()=>layout(true));
document.addEventListener("keydown", e=>{
  if(!document.getElementById("page-learn").classList.contains("active")) return;
  if(e.key==="ArrowRight" && carIndex<queue.length-1){ carIndex++; layout(true); }
  if(e.key==="ArrowLeft" && carIndex>0){ carIndex--; layout(true); }
});
document.getElementById("searchResults").innerHTML = `<div class="empty">输入关键词开始检索，或点任意掌握度页的词查看详情</div>`;
</script>
</body>
</html>
