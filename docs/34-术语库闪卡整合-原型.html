<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>知识库 · 术语闪卡（整合版）</title>
<!--
  34 · 术语库 × 闪卡整合原型（取代 doc 30 的独立四 Tab 形态）
  ─────────────────────────────────────────────────────────────
  doc 30 → doc 34 的整合原则（v2 修订：卡片流直接落在知识库首页，不设独立复习页）：
  1. 首页即卡片流：打开知识库就能左右滑动翻页，没有「先点入口再进复习」的额外一层
  2. 删除 doc 30 底部「不认识 / 有点模糊 / 会了」自评答题区 —— 不问"你学会了吗"
  3. 删除测验 Tab、掌握度环、连中 streak、今日已学 —— 全部属于能力评价
  4. 状态体系改用 doc 24 §6.3 四态：未遇到 / 见过 / 常见 / 已读（明度阶梯，零新增饱和色）
  5. 交互 = 纯浏览：翻过的卡自动记「已读」，只影响推荐顺序（doc 25 页脚承诺）
  6. 搜索 / 拼音首字母 / 别名检索（doc 30 移植 Glossary.search）降为二级页「搜索与分类」
  7. 知识页不用涨跌色：主色 = 品牌 blue #1E5BD6，状态条按明度阶梯（doc 24 §6.3）
  数据源：shared/.../data/entity/Glossary.kt 全量 80 词（沿用 doc 30 数据 + 依赖路径）
-->
<style>
  :root{
    --bg:#F5F6F8; --surface:#FFFFFF; --ink:#1C1F24; --t2:#5B6470; --t3:#8A919C; --line:#ECEEF2;
    --brand:#1E5BD6; --brandSoft:#EAF1FD; --seen:#C9D3E4; --muted:#EEF1F5; --unread:#D3D7DE;
    --radius:20px;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{
    background:var(--bg); color:var(--ink); min-height:100vh;
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    display:flex; justify-content:center;
  }
  #app{width:100%; max-width:430px; min-height:100vh; display:flex; flex-direction:column; position:relative}

  /* ───── 主页顶栏 ───── */
  .top{padding:20px 20px 8px; display:flex; align-items:flex-end; justify-content:space-between}
  .top h1{font-size:22px; letter-spacing:.5px}
  .top .sub{font-size:12px; color:var(--t3); margin-top:5px}
  .globe{text-align:right; font-size:10.5px; color:var(--t3); line-height:1.4; flex:none}
  .globe b{font-size:20px; color:var(--ink); font-variant-numeric:tabular-nums}
  .globe .gt{font-size:11px}

  /* ───── z1 衬后：最近遇到 + 五域面板 ───── */
  main{flex:1; padding-bottom:44px}
  .under{padding:0 14px; margin-top:8px; position:relative; z-index:1}
  .mini-lab{font-size:10.5px; color:var(--t3); letter-spacing:1px; padding:2px 2px 7px}
  .recs{display:flex; gap:8px; overflow-x:auto; padding-bottom:10px; scrollbar-width:none}
  .recs::-webkit-scrollbar{display:none}
  .rchip{
    flex:none; background:var(--surface); border:1px solid var(--line); border-radius:999px;
    padding:6px 12px; font-size:12px; color:var(--t2); cursor:pointer; white-space:nowrap;
  }
  .rchip b{color:var(--brand); font-weight:600; margin-left:2px; font-variant-numeric:tabular-nums}
  .dom{
    background:rgba(255,255,255,.92); border:1px solid var(--line); border-radius:16px;
    padding:13px 15px 11px; margin-top:8px; position:relative;
  }
  .dom-h{display:flex; align-items:baseline}
  .dom-n{font-size:13.5px; font-weight:600}
  .dom-c{margin-left:auto; font-size:11px; color:var(--t3); font-variant-numeric:tabular-nums}
  .seg{display:flex; gap:2px; height:6px; margin:10px 0 7px}
  .seg i{border-radius:2px; min-width:3px}
  .seg-l{display:flex; justify-content:space-between; font-size:10.5px; color:var(--t3)}
  .seg-l b{color:var(--t2); font-weight:600; font-variant-numeric:tabular-nums}
  .allentry{
    background:var(--surface); border:1px solid var(--line); border-radius:16px;
    padding:14px 16px; display:flex; justify-content:space-between; align-items:center;
    margin-top:10px; cursor:pointer; box-shadow:0 8px 20px rgba(28,31,36,.05);
    font-size:13.5px; font-weight:600;
  }
  .allentry .r{color:var(--brand); font-size:12.5px; font-weight:500}
  .foot-note{font-size:10px; color:var(--t3); text-align:center; line-height:16px; margin-top:14px}
  .foot-note a{color:var(--t3); text-decoration:underline; cursor:pointer}

  /* ───── 覆盖层通用（二级页）───── */
  .overlay{
    position:fixed; top:0; left:50%; width:100%; max-width:430px; height:100%;
    background:var(--bg); z-index:60; display:flex; flex-direction:column;
    transform:translate(-50%,5%); opacity:0; pointer-events:none;
    transition:transform .3s cubic-bezier(.2,.7,.3,1), opacity .3s;
  }
  .overlay.show{transform:translate(-50%,0); opacity:1; pointer-events:auto}
  #subpage{z-index:55}
  .fhead{padding:16px 16px 10px; display:flex; align-items:center}
  .fback{font-size:13px; color:var(--t2); cursor:pointer; width:76px; flex:none}
  .ftitle{flex:1; text-align:center; font-size:16px; font-weight:700}
  .fprog-t{width:76px; flex:none; text-align:right; font-size:10.5px; color:var(--t3); font-variant-numeric:tabular-nums}
  .fbar{height:4px; background:var(--muted); border-radius:2px; margin:0 16px; overflow:hidden; flex:none}
  .fbar-fill{height:100%; background:var(--brand); border-radius:2px; width:0; transition:width .4s}

  /* ───── 首页卡片流（v2：卡片堆直接放在首页；高度随内容自适应）───── */
  .car-viewport{
    position:relative; overflow:hidden; margin:2px 0 0; touch-action:pan-y;
    flex-shrink:0; height:430px; transition:height .35s ease;
  }
  .car-viewport.center{display:flex; align-items:center; justify-content:center}
  .car-track{position:absolute; inset:0}
  .car-card{
    position:absolute; top:6px; height:calc(100% - 16px); width:min(calc(100% - 76px), 340px);
    border-radius:var(--radius); background:var(--surface);
    border:1px solid var(--line); box-shadow:0 12px 32px rgba(28,31,36,.08);
    padding:20px; display:flex; flex-direction:column; overflow:hidden;
    transition:transform .42s cubic-bezier(.2,.7,.3,1), opacity .42s, box-shadow .42s, height .35s ease;
    will-change:transform; cursor:pointer; user-select:none; -webkit-user-select:none;
  }
  .car-track.dragging .car-card{transition:none}
  .car-card.sel{box-shadow:0 18px 44px rgba(30,91,214,.14); cursor:default}
  .car-card .cc-front{flex:1; display:flex; flex-direction:column; justify-content:center; min-height:0}
  .car-card.sel .cc-front{display:none}
  .car-card .cc-detail{display:none; flex:1; min-height:0; flex-direction:column}
  .car-card.sel .cc-detail{display:flex; overflow-y:auto; margin-top:10px; padding-right:2px}
  .car-card.sel .cc-detail::-webkit-scrollbar{width:0}
  .car-card .cc-detail .term-line{font-size:20px; font-weight:700; margin-bottom:2px; flex:none}
  .car-card .cc-detail .sec{margin-top:14px; flex:none}
  .car-card .cc-detail .sec .lab{font-size:11px; color:var(--t3); letter-spacing:2px; margin-bottom:6px}
  .car-card .cc-detail .plain{font-size:15.5px; line-height:1.7}
  .car-card .cc-detail .example{
    font-size:13px; line-height:1.7; color:var(--t2); background:#F7F8FA;
    border-left:3px solid var(--brand); padding:10px 12px; border-radius:0 10px 10px 0;
  }
  .car-card .cc-detail .adv{font-size:12.5px; line-height:1.7; color:var(--t2); max-height:0; overflow:hidden; transition:max-height .3s ease}
  .car-card .cc-detail .adv.open{max-height:180px; overflow-y:auto}
  .car-card .cc-detail .why{font-size:10.5px; color:var(--t3); line-height:1.6; margin-top:8px}
  .cat-tag{align-self:flex-start; font-size:11px; padding:3px 10px; border-radius:999px; background:var(--muted); color:var(--t2); flex:none}
  .read-dot{position:absolute; top:20px; right:20px; width:8px; height:8px; border-radius:50%; transition:background .3s}
  .term-big{font-size:40px; font-weight:700; text-align:center; letter-spacing:1px; line-height:1.15; word-break:break-all}
  .term-ascii{font-size:16px; color:var(--t3); text-align:center; margin-top:6px}
  .term-alias{text-align:center; font-size:12px; color:var(--t3); margin-top:10px; line-height:1.7}
  .pre-chips{display:flex; flex-wrap:wrap; gap:6px; justify-content:center; margin-top:16px}
  .pre-chips .pc{font-size:11px; color:var(--brand); background:var(--brandSoft); padding:4px 10px; border-radius:999px; cursor:pointer}
  .adv-toggle{
    display:inline-block; font-size:12px; color:var(--brand); background:var(--brandSoft);
    padding:4px 10px; border-radius:999px; margin-top:8px; cursor:pointer; align-self:flex-start;
  }
  .rel-chips{display:flex; flex-wrap:wrap; gap:6px; margin-top:14px; align-items:center}
  .rel-lab{font-size:11px; color:var(--t3); margin-right:2px; flex:none}
  .rel-chips .rc{
    font-size:11.5px; color:var(--ink); background:var(--muted); border:1px solid var(--line);
    padding:4px 11px; border-radius:999px; cursor:pointer;
  }
  .swipe-tip{text-align:center; font-size:11px; color:var(--t3); padding:8px 16px calc(12px + env(safe-area-inset-bottom)); flex:none}

  /* 完成面板 */
  .done-panel{
    background:var(--surface); border-radius:var(--radius); border:1px solid var(--line);
    padding:30px 24px; text-align:center; box-shadow:0 12px 32px rgba(28,31,36,.06);
    width:min(calc(100% - 44px), 340px);
  }
  .dp-t{font-size:19px; font-weight:700}
  .done-panel p{font-size:12.5px; color:var(--t3); margin-top:8px; line-height:1.7}
  .dp-btns{margin-top:20px; display:flex; flex-direction:column; gap:10px}
  .btn-main{
    border:none; background:var(--brand); color:#fff; font-size:14.5px; font-weight:600;
    padding:12px 0; border-radius:999px; cursor:pointer; font-family:inherit;
  }
  .btn-ghost{
    border:1px solid var(--line); background:var(--surface); color:var(--t2);
    font-size:13.5px; padding:11px 0; border-radius:999px; cursor:pointer; font-family:inherit;
  }

  /* ───── 二级页：搜索与分类 ───── */
  .sp-body{flex:1; overflow-y:auto; padding:0 14px calc(30px + env(safe-area-inset-bottom))}
  .searchbox{
    display:flex; align-items:center; gap:8px; background:var(--surface); border:1px solid var(--line);
    border-radius:14px; padding:12px 14px; margin-bottom:8px;
  }
  .searchbox input{flex:1; border:none; outline:none; font-size:15px; background:transparent; font-family:inherit; color:var(--ink)}
  .searchbox svg{flex:none; opacity:.4}
  .search-hint{font-size:11px; color:var(--t3); padding:2px 2px 10px; line-height:1.7}
  .search-hint code{background:var(--surface); padding:1px 6px; border-radius:6px; border:1px solid var(--line); font-size:10.5px}
  .chips{display:flex; gap:8px; overflow-x:auto; padding:2px 2px 12px; scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{
    flex:none; padding:7px 14px; border-radius:999px; background:var(--surface);
    border:1px solid var(--line); font-size:13px; color:var(--t3); cursor:pointer; transition:all .15s;
  }
  .chip.on{background:var(--ink); color:#fff; border-color:var(--ink)}
  .bgroup{margin-top:12px}
  .bg-h{display:flex; align-items:baseline; padding:4px 2px 8px}
  .bg-h .gn{font-size:13px; font-weight:600}
  .bg-c{margin-left:auto; font-size:11px; color:var(--t3); font-variant-numeric:tabular-nums}
  .bpanel{background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:2px 14px}
  .brow{padding:11px 0; border-bottom:1px solid var(--line); cursor:pointer}
  .brow:last-child{border-bottom:none}
  .brow:active{opacity:.7}
  .br1{display:flex; align-items:baseline; gap:8px}
  .brt{font-size:15.5px; font-weight:600}
  .bra{font-size:11.5px; color:var(--t3)}
  .badge{margin-left:auto; font-size:10px; padding:2px 8px; border-radius:5px; flex:none; font-weight:500}
  .st0{background:var(--muted); color:var(--t3)}
  .st1{background:var(--seen); color:#3E4654}
  .st2{background:var(--brandSoft); color:var(--brand)}
  .st3{background:var(--brand); color:#fff}
  .brp{font-size:12px; color:var(--t3); margin-top:4px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .rh{font-size:11px; color:var(--brand); margin-top:4px}
  .empty{text-align:center; color:var(--t3); font-size:13px; padding:44px 0}
  mark{background:transparent; color:var(--brand); font-weight:700}
  .sp-foot{font-size:10px; color:var(--t3); text-align:center; line-height:16px; margin-top:16px}
  .sp-foot a{color:var(--t3); text-decoration:underline; cursor:pointer}

  /* ───── 词条详情 Sheet ───── */
  .mask{
    position:fixed; inset:0; background:rgba(28,31,36,.42); opacity:0; pointer-events:none;
    transition:opacity .25s; z-index:90;
  }
  .mask.show{opacity:1; pointer-events:auto}
  .sheet{
    position:fixed; bottom:0; left:50%; transform:translate(-50%,105%); width:100%; max-width:430px;
    background:var(--surface); border-radius:24px 24px 0 0; z-index:100;
    transition:transform .32s cubic-bezier(.2,.7,.3,1);
    padding:14px 22px calc(28px + env(safe-area-inset-bottom)); max-height:80vh; overflow-y:auto;
  }
  .sheet.show{transform:translate(-50%,0)}
  .sheet .grab{width:38px; height:4px; border-radius:2px; background:var(--line); margin:0 auto 16px}
  .sheet .close{
    position:absolute; top:16px; right:18px; font-size:13px; color:var(--t3); cursor:pointer;
    background:var(--muted); width:28px; height:28px; border-radius:50%; text-align:center; line-height:28px;
  }
  .sh-term{font-size:24px; font-weight:700; margin-top:10px}
  .sh-ascii{font-size:14px; color:var(--t3); font-weight:400}
  .sh-meta{font-size:11.5px; color:var(--t3); margin-top:5px; line-height:1.7}
  .sh-sec{margin-top:16px}
  .sh-sec .lab{font-size:11px; color:var(--t3); letter-spacing:2px; margin-bottom:6px}
  .sh-sec .plain{font-size:15.5px; line-height:1.7}
  .sh-eg{
    margin-top:14px; font-size:13px; line-height:1.7; color:var(--t2); background:#F7F8FA;
    border-left:3px solid var(--brand); padding:10px 12px; border-radius:0 10px 10px 0;
  }
  .adv-full{font-size:12.5px; line-height:1.7; color:var(--t2)}
  .sheet-foot{font-size:10px; color:var(--t3); text-align:center; margin-top:18px}
</style>
</head>
<body>
<div id="app">

  <!-- ══════════ 知识库主页（闪卡整合在此）══════════ -->
  <header class="top">
    <div>
      <h1>知识库</h1>
      <div class="sub">从你遇到过的词，顺到还没懂的词</div>
    </div>
    <div class="globe">全库已读<br><b id="globeNum">0</b> <span class="gt">/ <span id="globeTotal">80</span></span></div>
  </header>

  <div class="fbar" style="margin:0 20px"><div class="fbar-fill" id="flowFill"></div></div>

  <div class="mini-lab" style="padding:12px 20px 6px">下一步该懂什么</div>

  <!-- 首页即卡片流：左右滑动直接翻页，无独立复习页 -->
  <div class="car-viewport" id="carViewport"><div class="car-track" id="carTrack"></div></div>
  <div class="swipe-tip">左右滑动或甩动翻页 · 轻点两侧卡片让它居中 · 翻过的词自动记为「已读」，仅影响推荐顺序</div>

  <main>
    <div class="under">
      <div class="mini-lab">最近在聊天里遇到</div>
      <div class="recs" id="recChips"></div>
      <div id="domains"></div>
      <div class="allentry" onclick="openSub()">
        <span>浏览全部 <b id="allCount">80</b> 个概念</span>
        <span class="r">搜索与分类 ›</span>
      </div>
      <div class="foot-note">状态只影响推荐顺序，不做任何能力评价 · 记录仅存本地</div>
    </div>
  </main>

  <!-- ══════════ 二级页：搜索与分类 ══════════ -->
  <div class="overlay" id="subpage">
    <div class="fhead">
      <div class="fback" onclick="closeSub()">‹ 知识库</div>
      <div class="ftitle">搜索与分类</div>
      <div class="fprog-t"></div>
    </div>
    <div class="sp-body">
      <div class="searchbox">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#1C1F24" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="searchInput" placeholder="搜术语 / 缩写 / 别名 / 拼音首字母" autocomplete="off">
      </div>
      <div class="search-hint">支持拼音首字母：<code>hsl</code> → 换手率 · <code>syl</code> → 市盈率 · <code>bxzj</code> → 北向资金；支持片段匹配（"换手" 也能搜到）</div>
      <div class="chips" id="subChips"></div>
      <div id="subList"></div>
      <div class="sp-foot">状态只影响推荐顺序，不做任何能力评价 · 记录仅存本地 · <a onclick="resetDemo()">重置演示数据</a></div>
    </div>
  </div>

  <!-- 词条详情 Sheet -->
  <div class="mask" id="mask" onclick="closeSheet()"></div>
  <div class="sheet" id="sheet"></div>
</div>

<script>
/* ═══════════════ 数据：Glossary.kt 全量 80 词（沿用 doc 30）═══════════════ */
const CATS = {TECHNICAL:"技术指标", VALUATION:"估值指标", MECHANISM:"交易机制", CAPITAL:"资金与情绪", FINANCIAL:"财报概念"};
/* k:key t:term a:ascii al:aliases c:cat p:人话 e:例子 adv:进阶 py:拼音首字母 */
const TERMS = [
{k:"MACD",t:"MACD",a:"MACD",al:["指数平滑异同平均","平滑异同移动平均线"],c:"TECHNICAL",p:"用两条均线的远近判断涨跌动力的强弱，比单看均线更早给出方向变化。",e:"茅台股价创新低但 MACD 绿柱在缩短，说明跌势在减弱，但还没到反转确认。",adv:"由 DIF（快线）与 DEA（慢线）及柱状图组成：DIF 上穿 DEA 称金叉，下穿称死叉。柱状图由正转负代表短期动能衰减。单一周期易失灵，常需与成交量、价格位置交叉验证。",py:""},
{k:"KDJ",t:"KDJ",a:"KDJ",al:["随机指标"],c:"TECHNICAL",p:"看当前价格在最近一段时间高低区间里的位置，判断是涨过头还是跌过头。",e:"短线连续上涨后 KDJ 的 J 值超过 100，通常是短期过热的提示，不宜追高。",adv:"K 为快速线、D 为慢速线，J = 3K − 2D，敏感度最高。震荡市中 K 在 20 以下回升常被视为超卖修复；单边趋势市中会长期钝化，需要配合趋势指标使用。",py:""},
{k:"RSI",t:"RSI",a:"RSI",al:["相对强弱指标"],c:"TECHNICAL",p:"把一段时间里涨的幅度和跌的幅度放在一起比，衡量买卖力量谁更强。",e:"RSI 升到 80 以上，说明这段时间买方明显占优，追进去的成本已经偏高。",adv:"常用 6 日 / 12 日 / 24 日三个周期。超过 70 一般称超买、低于 30 称超卖，但强趋势中指标会长期停留在极端区，单看阈值容易误判。",py:""},
{k:"MA",t:"均线",a:"MA",al:["移动平均线","平均线","5日线","20日线","60日线"],c:"TECHNICAL",p:"把最近若干天的收盘价平均后连成的线，用来抹平日常波动、看清方向。",e:"股价跌破 60 日均线且均线开始走平向下，中期趋势通常已经转弱。",adv:"周期越短越灵敏、越滞后小；越长越稳但反应慢。多头排列（短期均线在长期之上）与空头排列是常用的趋势判断框架，均线同时充当支撑与压力。",py:"jx"},
{k:"BOLL",t:"布林带",a:"BOLL",al:["布林线","布林通道"],c:"TECHNICAL",p:"在均线上下各画一条波动带，价格贴上轨算偏热、贴下轨算偏冷。",e:"股价沿布林上轨连续运行，说明短期偏强，但一旦开口收敛就要留意变盘。",adv:"中轨为 20 日均线，上下轨为中轨 ± 2 倍标准差。带宽收窄代表波动率压缩、常预示变盘；开口扩张代表趋势展开。",py:"bld"},
{k:"GOLDEN_CROSS",t:"金叉",a:"",al:["黄金交叉"],c:"TECHNICAL",p:"短期指标线从下往上穿过长期指标线，常被视为转强的信号。",e:"MACD 出现金叉当天成交量同步放大，信号的可靠性比缩量金叉更高。",adv:"金叉只是概率信号而非保证：零轴下方的金叉通常弱于零轴上方，震荡市中频繁出现的金叉多为噪音，需结合位置与量能过滤。",py:"jc"},
{k:"DEATH_CROSS",t:"死叉",a:"",al:["死亡交叉"],c:"TECHNICAL",p:"短期指标线从上往下穿过长期指标线，常被视为转弱的信号。",e:"高位出现死叉且跌破均线，往往比低位死叉更值得警惕。",adv:"与金叉对称，同样受位置影响：低位缩量死叉可能是最后一跌，高位放量死叉的杀伤力通常更大。",py:"sc"},
{k:"DIVERGENCE",t:"背离",a:"",al:["底背离","顶背离"],c:"TECHNICAL",p:"价格创新高（新低）而指标没有跟上，暗示当前趋势的动力在减弱。",e:"股价创阶段新低但 MACD 低点反而抬高，这种底背离常被解读为跌势衰竭。",adv:"背离可以持续很久，属于「预警」而非「拐点确认」；需要价格结构（如突破前高）与量能配合才算被验证。",py:"bl"},
{k:"TURNOVER",t:"换手率",a:"HSL",al:["换手"],c:"TECHNICAL",p:"当天成交的股票占流通股的比例，衡量这只票今天有多热。",e:"换手率从 1% 突然放大到 15%，通常意味着有大资金进场或离场。",adv:"不同市值区间的合理换手率差异很大：大盘蓝筹 1%-3% 属常态，小盘题材股 10% 以上才显活跃。需与历史分位而非绝对值比较。",py:"hsl"},
{k:"VOLUME_RATIO",t:"量比",a:"",al:["量比值"],c:"TECHNICAL",p:"当前每分钟成交量与过去五天同期的比值，看今天是不是突然放量。",e:"开盘量比超过 3，说明早盘资金关注度明显提升。",adv:"量比随时间衰减：开盘半小时的量比天然偏高，尾盘的意义有限，通常配合分时均价线一起看。",py:"lb"},
{k:"QFQ",t:"前复权",a:"",al:["复权"],c:"TECHNICAL",p:"把历史价格按分红送股倒推调整，让 K 线在除权前后连得上。",e:"看长期走势一定要用前复权，否则除权当天会出现假的暴跌缺口。",adv:"前复权以最新价为基准回推历史价，适合看长期趋势；后复权以最早价为基准前推，适合看真实累计收益；不复权保留原始成交价。",py:"qfq"},
{k:"HFQ",t:"后复权",a:"",al:[],c:"TECHNICAL",p:"以最早的价格为基准往前推，保留你真实拿到手的累计涨幅。",e:"十年长牛股用后复权看，涨幅往往比前复权数字更惊人，因为把分红送股都算进去了。",adv:"后复权把分红、送股等收益累计到后续价格中，适合衡量长期持有的总回报，但价格不对应当时真实成交价。",py:"hfq"},
{k:"SUPPORT",t:"支撑位",a:"",al:["支撑区"],c:"TECHNICAL",p:"股价下跌时比较容易止跌的位置，通常来自前期的密集成交区。",e:"股价三次回踩 60 日均线都没跌破，这条均线就是短期的支撑位。",adv:"支撑与压力会互相转换：一旦有效跌破，原支撑往往变成后续反弹的压力。有效性取决于成交量与停留时间，而非精确点位。",py:"zcw"},
{k:"RESISTANCE",t:"压力位",a:"",al:["阻力位"],c:"TECHNICAL",p:"股价上涨时比较难突破的位置，上方套牢盘多在此聚集。",e:"股价逼近前期高点却连续放量滞涨，说明上方压力位抛压较重。",adv:"压力位是成交密集区而非精确价格；放量有效突破后，原压力常会转为回踩支撑，缩量假突破则更容易回落。",py:"ylw"},
{k:"GAP",t:"缺口",a:"",al:["跳空","跳空缺口"],c:"TECHNICAL",p:"今天的最低价高于昨天的最高价（或相反），K 线之间出现的空白。",e:"业绩预增后一字涨停形成跳空缺口，通常代表消息面的强烈预期。",adv:"分突破缺口、持续缺口与衰竭缺口；缺口回补与否取决于是否伴随量能。A 股一字板形成的缺口短期多不回补。",py:"qk"},
{k:"AMPLITUDE",t:"振幅",a:"",al:[],c:"TECHNICAL",p:"当天最高价与最低价的差距，衡量这只票今天波动有多大。",e:"振幅 12% 说明多空分歧极大，持仓体验会很颠簸。",adv:"振幅通常按（最高价－最低价）÷昨收价计算；高位放量大振幅常代表分歧加剧，低位则需结合换手与趋势判断。",py:"zf"},
{k:"STD_DEV",t:"标准差",a:"",al:["均方差"],c:"TECHNICAL",p:"衡量一组数字离平均有多散。日收益的标准差大 = 这只票上蹿下跳得厉害。",e:"A 股日波动标准差 1%，B 股 3%，同样的行情下 B 的过山车幅度大约是 A 的三倍。",adv:"日标准差 × √250 可粗略年化。它衡量的是波动幅度本身，不分涨跌方向——大涨大跌都会推高标准差。",py:"bzc"},
{k:"VOLATILITY",t:"波动率",a:"VOL",al:["波动性"],c:"TECHNICAL",p:"价格波动剧烈程度的指标，通常由日收益标准差年化而来，越高越颠簸。",e:"说某票「波动率是大盘两倍」，意思是它每天的起伏幅度大约是大盘的两倍。",adv:"常指年化历史波动率 = 日收益标准差 × √250。另有期权隐含波动率（IV），反映市场对未来波动的预期，与历史波动率不同。",py:"bdl"},
{k:"CORRELATION",t:"相关系数",a:"r",al:["相关性","相关度"],c:"TECHNICAL",p:"两个标的涨跌步调有多一致，从 -1 到 +1。越接近 1 越同步，接近 0 各走各的。",e:"两只白酒股相关系数 0.9，同涨同跌；白酒股和银行股 0.3，一起拿才算分散。",adv:"常用日收益率的 Pearson 相关系数。注意：相关性不稳定，行情剧变时会快速抬升——「平时不同步、危机时齐跌」是常见现象。",py:"xgxs"},
{k:"BETA",t:"贝塔",a:"β",al:["贝塔系数","Beta"],c:"TECHNICAL",p:"个股跟着大盘涨跌的放大倍数。贝塔 1.5 = 大盘涨 1% 它平均涨 1.5%，跌时也放大。",e:"券商股贝塔普遍高，牛市里弹性大；公用事业股贝塔低，大盘怎么走它都波澜不惊。",adv:"由个股对指数收益做回归得到，= 相关系数 × (个股波动率 / 指数波动率)。贝塔高不代表能赚钱，只代表对大盘的敏感度高。",py:"bt"},
{k:"ALPHA",t:"阿尔法",a:"α",al:["阿尔法收益","超额收益"],c:"TECHNICAL",p:"扣掉大盘带来的部分后，你自己多赚（或多亏）的那部分。",e:"大盘涨 10%，你的组合涨 13%，多出的 3% 就近似你的阿尔法——正负才是本事，跟着大盘的部分不是。",adv:"严格定义来自 CAPM 回归的截距项。散户场景下用「组合收益 − 贝塔 × 指数收益」估算即可，注意成本与运气成分。",py:"aef"},
{k:"SHARPE",t:"夏普比率",a:"Sharpe",al:["夏普指数","夏普值"],c:"TECHNICAL",p:"每承受一份波动换来多少超额收益，是衡量「赚得稳不稳」的常用比例。",e:"两个组合都年赚 15%，一个睡得着觉（低波动）一个天天过山车，夏普比率会把前者算得更高。",adv:"夏普 = (收益 − 无风险利率) / 收益标准差。比较时要在相似周期与标的类型间进行；短周期高夏普常是运气或杠杆的产物。",py:"xpbl"},
{k:"MAX_DRAWDOWN",t:"最大回撤",a:"",al:["回撤"],c:"TECHNICAL",p:"从阶段最高点跌到最低点的最大幅度，衡量最疼的时候有多疼。",e:"净值从 1.5 跌到 1.2，最大回撤 20%——问问自己能不能扛住，再决定要不要这样的组合。",adv:"回撤 = (峰值 − 谷值) / 峰值。注意两点：回撤 50% 需要涨 100% 才能回本，亏损与回本不对称；它只描述历史最差一段，不预测未来最大跌幅。",py:"zdhc"},
{k:"PE",t:"市盈率",a:"PE",al:["本益比","PE_TTM"],c:"VALUATION",p:"股价除以每股收益，粗略理解成「按当前盈利多少年回本」。",e:"同为 30 倍市盈率，高增长的科技股和成熟的银行股，含义完全不同。",adv:"静态 PE 用去年年报、TTM 用最近四个季度、动态 PE 用预测盈利，口径不同数值差异很大。亏损企业 PE 为负，此时应改用 PS 或现金流口径。",py:"syl"},
{k:"PB",t:"市净率",a:"PB",al:[],c:"VALUATION",p:"股价除以每股净资产，看的是你为公司账面的家底付了多少钱。",e:"破净（PB 小于 1）在银行股中常见，但不等于一定便宜。",adv:"重资产行业（银行、地产、钢铁）更适用 PB；轻资产公司的核心资产是人和品牌，账面净资产参考价值有限。",py:"sjl"},
{k:"PS",t:"市销率",a:"PS",al:[],c:"VALUATION",p:"市值除以营业收入，给还没赚钱但收入增长快的公司估值。",e:"创新药公司常年亏损，用 PE 没法比，常用市销率横向比较。",adv:"",py:"sxsl"},
{k:"PEG",t:"PEG",a:"PEG",al:["市盈率相对盈利增长比率"],c:"VALUATION",p:"市盈率除以盈利增速，把「贵不贵」和「长得快不快」放在一起看。",e:"30 倍 PE 配 30% 增速，PEG 约等于 1，通常被认为估值与增长匹配。",adv:"增速为负时 PEG 无意义；用未来预期增速计算会引入预测误差，敏感性很高，建议做多情景测算。",py:""},
{k:"EPS",t:"每股收益",a:"EPS",al:[],c:"VALUATION",p:"公司净利润摊到每一股上有多少，是算市盈率的分母。",e:"每股收益从 1 元涨到 1.5 元，若股价不变，市盈率会自然下降。",adv:"",py:"mgsy"},
{k:"ROE",t:"净资产收益率",a:"ROE",al:[],c:"VALUATION",p:"公司用股东的钱一年能赚回多少比例，长期看是衡量赚钱能力的核心指标。",e:"连续十年 ROE 超过 20% 的消费龙头，通常具备很强的品牌护城河。",adv:"可用杜邦分析拆为净利率 × 资产周转率 × 权益乘数，高 ROE 若来自高杠杆，风险显著高于来自高净利率的情形。",py:"jzcsyl"},
{k:"DIVIDEND_YIELD",t:"股息率",a:"",al:["分红率"],c:"VALUATION",p:"一年分的现金红利除以股价，相当于这只股票的「利息」。",e:"股息率 5% 的银行股，在低利率环境下对长期资金有吸引力。",adv:"需区分静态（去年分红 / 现价）与预期（今年预计分红 / 现价）；一次性特别分红会虚高静态股息率。",py:"gxl"},
{k:"MARKET_CAP",t:"总市值",a:"",al:["市值"],c:"VALUATION",p:"股价乘以总股本，也就是市场给这家公司开的总价。",e:"总市值 2 万亿的公司上涨 1%，需要的资金量远大于小盘股。",adv:"",py:"zsz"},
{k:"FLOAT_MARKET_CAP",t:"流通市值",a:"",al:["流通盘"],c:"VALUATION",p:"按实际能在市场上买卖的股票算出来的市值，更贴近真实交易规模。",e:"流通市值小意味着少量资金就能拉动股价，波动通常更大。",adv:"",py:"ltsz"},
{k:"VALUATION_PERCENTILE",t:"估值分位",a:"",al:["历史分位","估值百分位"],c:"VALUATION",p:"当前估值在自己历史区间里所处的位置，用来判断相对高低。",e:"市盈率处于近十年 20% 分位，说明比过去八成的时间都便宜。",adv:"分位数依赖样本区间与公司自身的经营周期，若基本面发生结构性变化（如主营业务转型），历史分位的参考性会下降。",py:"gzfw"},
{k:"RISK_PREMIUM",t:"风险溢价",a:"",al:["股权风险溢价"],c:"VALUATION",p:"承担风险比把钱存银行应该多赚的部分。市场给的不确定性补偿。",e:"无风险利率 2%、股市长期回报约 8%，中间约 6% 就是风险溢价——它是对承担波动的报酬，不是保证。",adv:"",py:"fxyj"},
{k:"T1",t:"T+1",a:"",al:["T加一"],c:"MECHANISM",p:"A 股当天买入的股票要等下一个交易日才能卖出，资金同样是次日可用。",e:"早上追高买入后当天大跌，T+1 制度下当天无法止损。",adv:"",py:""},
{k:"PRICE_LIMIT",t:"涨跌停",a:"",al:["涨停","跌停","涨停板","跌停板"],c:"MECHANISM",p:"A 股对多数股票设单日涨跌幅上限（一般 10%，ST 股 5%），到价即停。",e:"一字涨停封单很大时，想买往往买不进，次日继续冲高的概率和开板风险并存。",adv:"",py:"zdt"},
{k:"CALL_AUCTION",t:"集合竞价",a:"",al:["竞价"],c:"MECHANISM",p:"开盘和收盘前几分钟集中撮合买卖单，一次性定出成交价。",e:"集合竞价高开 3%，通常反映隔夜消息的乐观预期。",adv:"",py:"jhjj"},
{k:"SUSPENSION",t:"停牌",a:"",al:["停牌中"],c:"MECHANISM",p:"交易所因重大事项临时停止该股票交易，期间无法买卖。",e:"筹划重组的公司停牌数月，复牌后价格往往一次性反映全部预期。",adv:"",py:"tp"},
{k:"EX_RIGHTS",t:"除权除息",a:"",al:["除权","除息","XR","DR"],c:"MECHANISM",p:"分红送股后按比例调低股价，账面上看似下跌，实际资产并没有减少。",e:"10 送 10 后股价从 20 元变成 10 元，你手上的股票数量翻倍，总资产不变。",adv:"",py:"cqcx"},
{k:"IPO_SUBSCRIPTION",t:"打新",a:"",al:["新股申购","申购新股"],c:"MECHANISM",p:"在新股上市前按发行价申购，中签后通常在上市初期卖出。",e:"科创板打新需要对应的市值底仓，不是有钱就能参与。",adv:"",py:"dx"},
{k:"BLOCK_TRADE",t:"大宗交易",a:"",al:["大宗"],c:"MECHANISM",p:"买卖双方在场外协商的大额交易，不进入集合竞价撮合。",e:"大股东通过大宗交易减持，接盘方通常有 6 个月锁定期。",adv:"",py:"dzjy"},
{k:"MARGIN",t:"融资融券",a:"",al:["两融","融资","融券"],c:"MECHANISM",p:"融资是借钱买股票（看涨加杠杆），融券是借股票卖出（看跌）。",e:"两融余额持续攀升，说明市场上愿意加杠杆的资金在增加。",adv:"杠杆会同时放大收益与亏损，维持担保比例低于警戒线会被要求追加保证金，否则触发强制平仓。",py:"rzrq"},
{k:"COMMISSION",t:"佣金",a:"",al:["手续费"],c:"MECHANISM",p:"买卖股票时付给券商的费用，按成交金额的一定比例收取。",e:"万分之三的佣金意味着 10 万元交易需要付 30 元。",adv:"",py:"yj"},
{k:"STAMP_DUTY",t:"印花税",a:"",al:[],c:"MECHANISM",p:"卖出股票时按成交金额缴纳给国家的税，目前 A 股为千分之一。",e:"卖出 10 万元股票，印花税 100 元，这是卖出端的固定成本。",adv:"",py:"yhs"},
{k:"CHINEXT",t:"创业板",a:"",al:["创业板指"],c:"MECHANISM",p:"面向成长型企业的板块，涨跌幅上限 20%，波动比主板更大。",e:"创业板股票单日涨跌可达 20%，持有体验更颠簸。",adv:"",py:"cyb"},

/* 依赖路径：学某词前应先懂的前置概念（doc 24 §6.3「先懂 / 看懂后」） */
const PREREQ = {
  GOLDEN_CROSS:["MA","MACD"], DEATH_CROSS:["MA","MACD"], DIVERGENCE:["MACD"], BOLL:["MA"],
  SUPPORT:["MA"], RESISTANCE:["MA"], PEG:["PE"], EPS:["NET_PROFIT"],
  VALUATION_PERCENTILE:["PE","PB"], FLOAT_MARKET_CAP:["MARKET_CAP"], DIVIDEND_YIELD:["DIVIDEND","MARKET_CAP"],
  VOLUME_RATIO:["TURNOVER"], NET_INFLOW:["MAIN_CAPITAL"], DEDUCTED_PROFIT:["NET_PROFIT"],
  GROSS_MARGIN:["REVENUE"], NET_MARGIN:["REVENUE","NET_PROFIT"], YOY:["FINANCIAL_REPORT"], MOM:["YOY"],
  HHI:["CORRELATION"], BETA:["CORRELATION","VOLATILITY"],
};
const byKey = Object.fromEntries(TERMS.map(t=>[t.k,t]));
const dependents = {};
Object.entries(PREREQ).forEach(([k,pres])=>pres.forEach(p=>{(dependents[p]=dependents[p]||[]).push(k)}));

/* ═══════════════ 状态：四态曝光模型（doc 24 §6.3）═══════════════
   未遇到 0 / 见过 1（聊天里遇到 1 次）/ 常见 2（≥3 次）/ 已读 3（顺一遍翻过）
   不做能力评价：没有「学会 / 掌握 / 答对」的概念，已读只影响推荐顺序。 */
const LS_KEY = "sc_kb_read_v2";
const STATUS_NAMES = ["未遇到","见过","常见","已读"];
const SEG_COLORS = ["#EEF1F5","#C9D3E4","#EAF1FD","#1E5BD6"];
/* 演示数据：遇到次数（真实版来自聊天术语高亮 / 风险地图埋点） */
const HITS = {CORRELATION:3, PE:2, TURNOVER:2, MA:4, VOLATILITY:1, GOODWILL:1, UNLOCK:1, HHI:1,
              MACD:1, MAIN_CAPITAL:1, PRICE_LIMIT:1, POSITION:1};
const READ_SEED = ["MA","MACD","TURNOVER","PE","T1","PRICE_LIMIT","POSITION","NET_PROFIT","YOY","MOM","FINANCIAL_REPORT","MARKET_CAP"];

let readMap = {};
function loadRead(){
  try{
    readMap = JSON.parse(localStorage.getItem(LS_KEY)||"null") || null;
    if(!readMap){
      readMap = {};
      READ_SEED.forEach(k=>readMap[k]=Date.now());
      saveRead();
    }
  }catch(e){ readMap = {}; }
}
function saveRead(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(readMap)); }catch(e){} }
function isRead(k){ return !!readMap[k]; }
function readCount(){ return Object.keys(readMap).length; }
function hitsOf(k){ return HITS[k]||0; }
function statusOf(k){ return isRead(k) ? 3 : hitsOf(k)>=3 ? 2 : hitsOf(k)>=1 ? 1 : 0; }

/* ═══════════════ 推荐：「下一步该懂什么」（doc 24 §6.3 规则）═══════════════
   候选 = 未读 且 全部前置概念已读；排序 = 遇到次数 → 所属域已读比例 */
function domainRatio(c){
  const list = TERMS.filter(t=>t.c===c);
  return list.filter(t=>isRead(t.k)).length / list.length;
}
function recommend(){
  const cands = TERMS.filter(t=>!isRead(t.k) && (PREREQ[t.k]||[]).every(p=>isRead(p)));
  if(!cands.length) return null;
  cands.sort((a,b)=>{
    const h = hitsOf(b.k)-hitsOf(a.k);
    if(h) return h;
    return domainRatio(b.c)-domainRatio(a.c);
  });
  return cands[0];
}
function whyText(t){
  /* 归因文案保留给词条 Sheet / 后续卡片内使用 */
  const h = hitsOf(t.k);
  if(h>0) return `你在自选与风险地图里遇到过「${t.t}」${h} 次`;
  const pres = (PREREQ[t.k]||[]).filter(p=>isRead(p));
  if(pres.length) return `前置的「${pres.map(p=>byKey[p].t).join("、")}」你都已读过`;
  const list = TERMS.filter(x=>x.c===t.c && isRead(x.k));
  if(list.length) return `「${CATS[t.c]}」里你已读过 ${list.length} 个，顺着补齐这一域`;
  return "还没遇到过，从最基础的概念开始";
}

/* ═══════════════ 首页状态区（进度 + 最近遇到 + 五域面板，读一张刷一次）═══════════════ */
function renderHome(){
  const total = TERMS.length, read = readCount();
  document.getElementById("globeNum").textContent = read;
  document.getElementById("globeTotal").textContent = total;
  document.getElementById("allCount").textContent = total;
  document.getElementById("flowFill").style.width = (read/total*100)+"%";

  const hitTerms = TERMS.filter(t=>hitsOf(t.k)>0).sort((a,b)=>hitsOf(b.k)-hitsOf(a.k)).slice(0,6);
  document.getElementById("recChips").innerHTML = hitTerms.map(t=>
    `<span class="rchip" onclick="openSheet('${t.k}')">${esc(t.t)} <b>×${hitsOf(t.k)}</b></span>`).join("");

  const doms = Object.keys(CATS).map(c=>{
    const list = TERMS.filter(t=>t.c===c);
    const cnt = [0,0,0,0];
    list.forEach(t=>cnt[statusOf(t.k)]++);
    return {c, list, cnt, enc:cnt[1]+cnt[2]+cnt[3]};
  }).sort((a,b)=>b.enc-a.enc);
  document.getElementById("domains").innerHTML = doms.map(d=>`
    <div class="dom">
      <div class="dom-h"><span class="dom-n">${CATS[d.c]}</span><span class="dom-c">已遇 ${d.enc} / 共 ${d.list.length}</span></div>
      <div class="seg">${d.cnt.map((n,i)=> n>0 ? `<i style="width:${n/d.list.length*100}%;background:${SEG_COLORS[i]}"></i>` : "").join("")}</div>
      <div class="seg-l">${STATUS_NAMES.map((n,i)=>`<span>${n} <b>${d.cnt[i]}</b></span>`).join("")}</div>
    </div>`).join("");
}

/* ═══════════════ 首页卡片流：翻页即已读，无自评 ═══════════════ */
let queue = [], carIndex = 0;
let drag = null, dragAxis = null;
let sessionSet = new Set();   // 本轮翻过的词

function buildFlowQueue(startKey, includeRead){
  const ks = TERMS.filter(t=> includeRead || !isRead(t.k)).map(t=>t.k);
  ks.sort((a,b)=> hitsOf(b)-hitsOf(a));
  if(startKey){
    const i = ks.indexOf(startKey);
    if(i > 0){ ks.splice(i,1); ks.unshift(startKey); }
  }
  return ks;
}
function startQueue(includeRead){
  const vp = document.getElementById("carViewport");
  vp.classList.remove("center");
  vp.innerHTML = `<div class="car-track" id="carTrack"></div>`;   // 完成面板可能已替换掉轨道节点
  const rec = includeRead ? null : recommend();   // 未读流从「下一步该懂什么」开始
  queue = buildFlowQueue(rec ? rec.k : null, !!includeRead);
  carIndex = 0;
  sessionSet = new Set();
  if(!queue.length){ renderFlowDone(); return; }
  buildCarousel();
}
function markRead(k){
  if(!k || isRead(k)) return;
  readMap[k] = Date.now();
  saveRead();
  sessionSet.add(k);
  document.querySelectorAll(`.car-card[data-k="${k}"] .read-dot`).forEach(d=>d.style.background = SEG_COLORS[3]);
  renderHome();   // 顶栏进度 + 五域状态条即时刷新
}
function syncRead(){ markRead(queue[carIndex]); }

function depRowsHTML(k, mode){
  const go = k2 => mode==="jump" ? `jumpTo('${k2}')` : `openSheet('${k2}')`;
  const pres = (PREREQ[k]||[]), deps = (dependents[k]||[]).slice(0,3);
  let h = "";
  if(pres.length) h += `<div class="rel-chips"><span class="rel-lab">先懂</span>${pres.map(p=>`<span class="rc" onclick="${go(p)}">${esc(byKey[p].t)} ›</span>`).join("")}</div>`;
  if(deps.length) h += `<div class="rel-chips"><span class="rel-lab">看懂后</span>${deps.map(d=>`<span class="rc" onclick="${go(d)}">${esc(byKey[d].t)} ›</span>`).join("")}</div>`;
  return h;
}
function cardHTML(key){
  const t = byKey[key];
  const s = statusOf(key);
  const pres = (PREREQ[t.k]||[]).map(k=>`<span class="pc" onclick="jumpTo('${k}')">先懂：${esc(byKey[k].t)}</span>`).join("");
  const advBlock = t.adv ? `<div class="adv-toggle" onclick="toggleAdv(this)">进阶解释 ▾</div><div class="adv">${esc(t.adv)}</div>` : "";
  return `<div class="car-card" data-k="${t.k}">
    <span class="cat-tag">${CATS[t.c]}</span>
    <span class="read-dot" style="background:${SEG_COLORS[s]}"></span>
    <div class="cc-front">
      <div class="term-big">${esc(t.t)}</div>
      ${t.a?`<div class="term-ascii">${esc(t.a)}</div>`:""}
      ${t.al.length?`<div class="term-alias">又叫：${t.al.map(esc).join(" · ")}</div>`:""}
      ${pres?`<div class="pre-chips">${pres}</div>`:""}
    </div>
    <div class="cc-detail">
      <div class="term-line">${esc(t.t)}${t.a?` <span style="font-size:13px;color:var(--t3);font-weight:400">${esc(t.a)}</span>`:""}</div>
      <div class="sec"><div class="lab">人话解释</div><div class="plain">${esc(t.p)}</div><div class="why">为什么是这张：${whyText(t)}</div></div>
      <div class="sec"><div class="lab">A 股语境例子</div><div class="example">${esc(t.e)}</div></div>
      <div class="sec">${advBlock}</div>
      ${depRowsHTML(t.k, "jump")}
    </div>
  </div>`;
}
function carStep(){
  const first = document.querySelector("#carTrack .car-card");
  return (first ? first.offsetWidth : 300) + 14;
}
/* 摆位：off=0 的卡片居中并展开；拖拽中 near<0.5 的卡片实时放大展开 */
function layout(animate){
  const track = document.getElementById("carTrack");
  if(!track) return;
  const cards = [...track.children];
  if(!cards.length) return;
  const W = document.getElementById("carViewport").clientWidth;
  const cardW = cards[0].offsetWidth;
  const step = carStep();
  const base = (drag && drag.active) ? drag.dx : 0;
  track.classList.toggle("dragging", !animate);
  cards.forEach((el,i)=>{
    const off = (i-carIndex)*step + base;
    const near = Math.min(Math.abs(off)/step, 1);
    el.dataset.i = i;
    el.classList.toggle("sel", near < 0.5);
    el.style.transform = `translate(${W/2-cardW/2+off}px, ${near*16}px) scale(${0.88+0.12*(1-near)})`;
    el.style.opacity = Math.abs(off) > step*1.7 ? 0 : (0.45 + 0.55*(1-near));
    el.style.zIndex = 100 - Math.round(Math.abs(off));
  });
}
function settle(){
  layout(false);
  requestAnimationFrame(()=>{
    const t = document.getElementById("carTrack");
    if(t) t.classList.remove("dragging");
  });
}
/* 视口高度贴合当前展开卡的内容（clamp 320–560），短卡不留大段空白 */
function fitViewportHeight(){
  const vp = document.getElementById("carViewport");
  if(!vp) return;
  const done = vp.querySelector(".done-panel");
  const selCard = vp.querySelector(".car-card.sel");
  let h = 430;
  if(done){
    h = done.getBoundingClientRect().height + 48;
  } else if(selCard){
    const prev = selCard.style.height;
    selCard.style.height = "auto";          // 临时放开定高，量自然内容高
    h = selCard.scrollHeight + 22;          // + top:6 偏移 + 上下边框余量
    selCard.style.height = prev;
  }
  vp.style.height = Math.max(320, Math.min(560, Math.round(h))) + "px";
}
function buildCarousel(){
  const track = document.getElementById("carTrack");
  if(!track) return;
  track.innerHTML = queue.map(cardHTML).join("");
  settle();
  syncRead();   // 首张卡完整展示即记为已读
  fitViewportHeight();
}
function bindCarousel(){
  const vp = document.getElementById("carViewport");
  let sx=0, sy=0, dx=0, samples=[];
  vp.addEventListener("pointerdown", e=>{
    if(e.target.closest(".adv-toggle,.rc,.pc,button,.done-panel")) return;
    dragAxis = null; sx=e.clientX; sy=e.clientY; dx=0;
    samples = [[performance.now(), e.clientX]];
    drag = {dx:0, active:true, card: e.target.closest(".car-card")};
    try{ vp.setPointerCapture(e.pointerId); }catch(_){}
  });
  vp.addEventListener("pointermove", e=>{
    if(!drag || !drag.active) return;
    const mx = e.clientX - sx, my = e.clientY - sy;
    if(!dragAxis){
      if(Math.abs(mx)>7 || Math.abs(my)>7) dragAxis = Math.abs(mx)>Math.abs(my) ? "x" : "y";
      else return;
    }
    if(dragAxis==="y"){ drag.active=false; layout(true); return; }
    dx = mx; drag.dx = dx;
    samples.push([performance.now(), e.clientX]);
    if(samples.length>6) samples.shift();
    layout(false);
  });
  const finish = e=>{
    if(!drag) return;
    const wasDragX = drag.active && dragAxis==="x";
    const wasTap = dragAxis===null;
    const tapCard = drag.card;
    drag = null; dragAxis = null;
    const track = document.getElementById("carTrack");
    if(!track || !track.children.length) return;
    if(wasDragX){
      const now = performance.now();
      let v = 0;
      const baseS = samples.find(s=>now-s[0]<=90);
      if(baseS){
        const dt = now - baseS[0];
        if(dt>0) v = (e.clientX - baseS[1]) / dt;
      }
      const step = carStep();
      const proj = dx + v*160;
      let steps = -Math.round(proj/step);
      if(steps===0 && Math.abs(dx) > step*0.3) steps = dx<0 ? 1 : -1;
      if(carIndex===queue.length-1 && steps>0){ renderFlowDone(); return; }   // 最后一页再往前 → 完成面板
      carIndex = Math.max(0, Math.min(queue.length-1, carIndex + steps));
    } else if(wasTap && tapCard){
      const i = +tapCard.dataset.i;
      if(!isNaN(i) && i!==carIndex) carIndex = i;
    }
    layout(true);
    syncRead();
    fitViewportHeight();
  };
  vp.addEventListener("pointerup", finish);
  vp.addEventListener("pointercancel", finish);
}
function toggleAdv(btn){
  const body = btn.nextElementSibling;
  body.classList.toggle("open");
  btn.textContent = body.classList.contains("open") ? "收起进阶 ▴" : "进阶解释 ▾";
  fitViewportHeight();
}
function jumpTo(key){
  if(!queue.length) return;
  let i = queue.indexOf(key);
  if(i === -1){
    queue.splice(carIndex+1, 0, key);
    const track = document.getElementById("carTrack");
    const cur = track && track.children[carIndex];
    if(cur) cur.insertAdjacentHTML("afterend", cardHTML(key));
    i = carIndex + 1;
  }
  carIndex = i;
  settle();
  syncRead();
  fitViewportHeight();
}
function renderFlowDone(){
  const vp = document.getElementById("carViewport");
  vp.classList.add("center");
  vp.innerHTML = `<div class="done-panel">
    <div class="dp-t">这一遍顺完了</div>
    <p>这一遍翻过 ${sessionSet.size} 个概念 · 全库已读 ${readCount()} / ${TERMS.length}</p>
    <div class="dp-btns">
      <button class="btn-main" onclick="startQueue(true)">再顺一遍（含已读）</button>
      <button class="btn-ghost" onclick="openSub()">浏览词表与搜索</button>
    </div>
  </div>`;
  fitViewportHeight();
}

/* ═══════════════ 二级页：搜索与分类 ═══════════════ */
let subCat = "ALL";
function openSub(){
  document.getElementById("subpage").classList.add("show");
  renderSub();
}
function closeSub(){ document.getElementById("subpage").classList.remove("show"); }
function pickSubCat(c){ subCat = c; renderSub(); }
function rowHTML(t, q, hitLine){
  const s = statusOf(t.k);
  const name = q ? hl(t.t,q) : esc(t.t);
  const ascii = q ? hl(t.a,q) : esc(t.a);
  return `<div class="brow" onclick="openSheet('${t.k}')">
    <div class="br1"><span class="brt">${name}</span>${t.a?`<span class="bra">${ascii}</span>`:""}<span class="badge st${s}">${STATUS_NAMES[s]}</span></div>
    <div class="brp">${esc(t.p)}</div>
    ${hitLine||""}
  </div>`;
}
function renderSub(){
  const total = TERMS.length;
  const chips = [["ALL",`全部 · ${total}`]].concat(Object.entries(CATS).map(([c,l])=>[c,`${l} · ${TERMS.filter(t=>t.c===c).length}`]));
  document.getElementById("subChips").innerHTML = chips.map(([c,l])=>
    `<div class="chip ${c===subCat?"on":""}" onclick="pickSubCat('${c}')">${l}</div>`).join("");
  document.getElementById("subList").innerHTML = renderBrowse("");
}
function renderBrowse(q){
  const box = document.getElementById("subList");
  if(q){
    const hits = searchTerms(q).slice(0,30);
    if(!hits.length) return `<div class="empty">没有找到「${esc(q)}」相关的术语</div>`;
    return `<div class="bpanel">${hits.map(t=>{
      let hitLine = "";
      const aliasHit = t.al.find(a=>a.toUpperCase().includes(q.toUpperCase()));
      const pyHit = !aliasHit && (t.py||"").toUpperCase().startsWith(q.toUpperCase()) ? t.py : "";
      if(!t.t.toUpperCase().includes(q.toUpperCase()) && !(t.a||"").toUpperCase().includes(q.toUpperCase())){
        if(aliasHit) hitLine = `<div class="rh">命中别名：${hl(aliasHit,q)}</div>`;
        else if(pyHit) hitLine = `<div class="rh">命中拼音首字母：${esc(pyHit)}</div>`;
      }
      return rowHTML(t,q).replace("</div>\n    </div>", "") + "" + hitLine + "</div>";
    }).join("")}</div>`;
  }
  const cats = subCat==="ALL" ? Object.keys(CATS) : [subCat];
  return cats.map(c=>{
    const list = TERMS.filter(t=>t.c===c);
    const m = list.filter(t=>isRead(t.k)).length;
    return `<div class="bgroup">
      <div class="bg-h"><span class="gn">${CATS[c]}</span><span class="bg-c">已读 ${m} / ${list.length}</span></div>
      <div class="bpanel">${list.map(t=>rowHTML(t,"")).join("")}</div>
    </div>`;
  }).join("");
}
function searchTerms(qraw){
  const q = qraw.trim().toUpperCase();
  if(!q) return [];
  const res = [];
  for(const t of TERMS){
    const hay = (t.t+" "+(t.a||"")+" "+t.al.join(" ")).toUpperCase();
    const ini = (t.py||"").toUpperCase();
    let s = -1;
    if(t.t.toUpperCase()===q) s=100;
    else if((t.a||"").toUpperCase()===q) s=95;
    else if(t.al.some(a=>a.toUpperCase()===q)) s=90;
    else if(ini && ini===q) s=88;
    else if(t.t.toUpperCase().startsWith(q)) s=80;
    else if((t.a||"").toUpperCase().startsWith(q)) s=75;
    else if(ini && ini.startsWith(q)) s=72;
    else if(hay.includes(q)) s=60;
    if(s>=0) res.push([s,t]);
  }
  res.sort((x,y)=>y[0]-x[0] || x[1].k.localeCompare(y[1].k));
  return res.map(r=>r[1]);
}
function hl(text, q){
  const s = String(text||"");
  const i = s.toUpperCase().indexOf(q.toUpperCase());
  if(i<0 || !q) return esc(s);
  return esc(s.slice(0,i))+"<mark>"+esc(s.slice(i,i+q.length))+"</mark>"+esc(s.slice(i+q.length));
}

/* ═══════════════ 词条详情 Sheet（无任何标记按钮）═══════════════ */
function openSheet(key){
  const t = byKey[key]; if(!t) return;
  const s = statusOf(key);
  const ts = readMap[key];
  const stLine = s===3
    ? `已读 · ${new Date(ts).getMonth()+1} 月 ${new Date(ts).getDate()} 日`
    : s>0 ? `在聊天里遇到过 ${hitsOf(key)} 次 · 还没读过`
          : `还没遇到过`;
  document.getElementById("sheet").innerHTML = `
    <div class="grab"></div><div class="close" onclick="closeSheet()">×</div>
    <span class="cat-tag">${CATS[t.c]}</span>
    <div class="sh-term">${esc(t.t)}${t.a?` <span class="sh-ascii">${esc(t.a)}</span>`:""}</div>
    <div class="sh-meta">${t.al.length?"又叫："+esc(t.al.join(" · "))+" · ":""}${stLine}</div>
    <div class="sh-sec"><div class="lab">人话解释</div><div class="plain">${esc(t.p)}</div></div>
    <div class="sh-eg">${esc(t.e)}</div>
    ${t.adv?`<div class="sh-sec"><div class="lab">进阶解释</div><div class="adv-full">${esc(t.adv)}</div></div>`:""}
    ${depRowsHTML(key, "sheet")}
    <div class="sheet-foot">状态只影响推荐顺序，不做任何能力评价</div>`;
  document.getElementById("mask").classList.add("show");
  document.getElementById("sheet").classList.add("show");
}
function closeSheet(){
  document.getElementById("mask").classList.remove("show");
  document.getElementById("sheet").classList.remove("show");
}
function resetDemo(){
  if(!confirm("重置演示数据？所有已读状态会回到初始演示状态。")) return;
  try{ localStorage.removeItem(LS_KEY); }catch(e){}
  readMap = {};
  READ_SEED.forEach(k=>readMap[k]=Date.now());
  saveRead();
  closeSheet();
  renderHome();
  renderSub();
}

/* ═══════════════ 工具与启动 ═══════════════ */
function esc(s){ return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

loadRead();
renderHome();
bindCarousel();
startQueue(false);   // 首页即卡片流：打开就直接开始顺「下一步该懂什么」
renderSub();
document.getElementById("searchInput").addEventListener("input", e=>{
  const q = e.target.value.trim();
  document.getElementById("subList").innerHTML = q ? renderBrowse(q) : renderBrowse("");
});
window.addEventListener("resize", ()=>{
  const tr = document.getElementById("carTrack");
  if(tr && tr.children.length){ layout(true); fitViewportHeight(); }
});
document.addEventListener("keydown", e=>{
  const tr = document.getElementById("carTrack");
  if(!queue.length || !tr || !tr.children.length) return;
  if(e.key==="ArrowRight"){
    if(carIndex===queue.length-1) renderFlowDone();
    else { carIndex++; layout(true); syncRead(); }
  }
  if(e.key==="ArrowLeft" && carIndex>0){ carIndex--; layout(true); syncRead(); }
});
</script>
