<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1440">
<title>市场界面重构 · 原型 v2（真实 2026-09-02 收盘数据）</title>
<style>
:root{
  --page:#F5F6F8; --surface:#FFFFFF; --muted:#EEF1F5;
  --t1:#1A1D23; --t2:#5B6573; --t3:#5F6B82;
  --brand:#1E5BD6; --brandSoft:#EAF1FD;
  --rise:#D92E2E; --fall:#0C7A45; --riseSoft:#FCEDED; --fallSoft:#E9F4EE;
  --div:#E2E8F0; --flat:#8A93A3;
  --glass:rgba(255,255,255,.82); --glassEdge:rgba(255,255,255,.9);
  --sh1:0 1px 2px rgba(20,28,45,.04);
  --sh2:0 6px 18px rgba(20,28,45,.07);
  --sh3:0 14px 38px rgba(20,28,45,.11);
  --stageBg:#E8EBF0; --stageInk:#1A1D23; --stageSub:#6B7484; --stageLine:#D3D9E2;
  --stageCard:#F7F8FA;
}
[data-theme="dark"]{
  --page:#141415; --surface:#1D1D1F; --muted:#2C2C2E;
  --t1:#F5F5F7; --t2:#C7C7CC; --t3:#8E8E93;
  --brand:#82A8FF; --brandSoft:#1E3158;
  --rise:#FF7878; --fall:#54D6A6; --riseSoft:#3A2022; --fallSoft:#15342C;
  --div:#363638; --flat:#7A7A80;
  --glass:rgba(29,29,31,.76); --glassEdge:rgba(255,255,255,.08);
  --sh1:0 1px 2px rgba(0,0,0,.3);
  --sh2:0 6px 18px rgba(0,0,0,.4);
  --sh3:0 14px 38px rgba(0,0,0,.5);
  --stageBg:#0E0E10; --stageInk:#ECECEE; --stageSub:#9A9AA2; --stageLine:#2A2A2E;
  --stageCard:#17171A;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:var(--stageBg); color:var(--stageInk);
  font:14px/1.55 -apple-system,BlinkMacSystemFont,"SF Pro SC","PingFang SC","Microsoft YaHei",sans-serif;
  font-variant-numeric:tabular-nums; -webkit-font-smoothing:antialiased;
  min-width:1440px; padding-bottom:80px;
  transition:background .4s ease,color .4s ease;
}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}

/* ============ 展示台 chrome ============ */
.stage-head{
  position:sticky; top:0; z-index:100; background:var(--stageBg);
  border-bottom:1px solid var(--stageLine); padding:18px 40px 0;
}
.sh-top{display:flex;align-items:flex-end;gap:20px;justify-content:space-between}
.sh-title{font-size:19px;font-weight:700;letter-spacing:-.2px}
.sh-sub{font-size:12px;color:var(--stageSub);margin-top:3px}
.sh-tools{display:flex;gap:8px;align-items:center;padding-bottom:2px}
.btn{
  border:1px solid var(--stageLine); background:var(--stageCard); color:var(--stageInk);
  font:600 12px/1 inherit; padding:8px 13px; border-radius:8px; cursor:pointer;
  transition:.18s ease; display:inline-flex; align-items:center; gap:6px;
}
.btn:hover{border-color:var(--brand);color:var(--brand)}
.btn.on{background:var(--brand);border-color:var(--brand);color:#fff}
.dot{width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.5}
.btn.on .dot{opacity:1;animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.25}}
.tabs{display:flex;gap:26px;margin-top:16px}
.tab{
  font:600 13px/1 inherit;color:var(--stageSub);background:none;border:none;cursor:pointer;
  padding:0 0 12px;border-bottom:2px solid transparent;transition:.18s;
}
.tab:hover{color:var(--stageInk)}
.tab[aria-selected="true"]{color:var(--stageInk);border-bottom-color:var(--brand)}

.stage-body{padding:30px 40px 0}
.view{display:none}
.view.on{display:block}
.row{display:flex;gap:24px;align-items:flex-start}
.row.scrollx{overflow-x:auto;padding-bottom:14px}
.col{flex:0 0 auto;width:390px}
.cap{margin-bottom:10px}
.cap b{display:block;font-size:13px;font-weight:700;letter-spacing:-.1px}
.cap span{display:block;font-size:11px;color:var(--stageSub);margin-top:2px;line-height:1.5}
.specs{margin-top:12px;display:flex;flex-wrap:wrap;gap:5px}
.spec{
  font:500 10.5px/1.4 inherit;color:var(--stageSub);background:var(--stageCard);
  border:1px solid var(--stageLine);border-radius:5px;padding:4px 7px;
}
.spec b{color:var(--brand);font-weight:700}

/* ============ 设备框 ============ */
.device{
  width:390px;height:844px;border-radius:44px;padding:9px;
  background:linear-gradient(160deg,#3a3d44,#15171b);
  box-shadow:0 22px 60px rgba(0,0,0,.34),0 0 0 1px rgba(255,255,255,.08) inset;
  position:relative;flex:0 0 auto;
}
.screen{
  width:100%;height:100%;border-radius:36px;overflow-y:auto;overflow-x:hidden;
  background:var(--page);position:relative;scrollbar-width:none;
}
.screen::-webkit-scrollbar{display:none}
.notch{
  position:absolute;top:16px;left:50%;transform:translateX(-50%);
  width:104px;height:26px;border-radius:14px;background:#0b0c0e;z-index:60;
}

/* ============ 页面内容 ============ */
.mp{position:relative;padding-bottom:34px;color:var(--t1)}
/* 氛围底：z0 */
.ambient{
  position:absolute;inset:0 0 auto;height:430px;pointer-events:none;z-index:0;
  background:
    radial-gradient(120% 70% at 18% 0%,var(--amb1) 0%,transparent 62%),
    radial-gradient(90% 55% at 92% 10%,var(--amb2) 0%,transparent 58%);
  opacity:1;
}
.mp[data-mood="fall"]{--amb1:rgba(12,122,69,.13);--amb2:rgba(30,91,214,.07)}
.mp[data-mood="rise"]{--amb1:rgba(217,46,46,.13);--amb2:rgba(217,46,46,.05)}
.mp[data-mood="flat"]{--amb1:rgba(138,147,163,.14);--amb2:rgba(30,91,214,.05)}
[data-theme="dark"] .mp[data-mood="fall"]{--amb1:rgba(84,214,166,.14);--amb2:rgba(130,168,255,.09)}
[data-theme="dark"] .mp[data-mood="rise"]{--amb1:rgba(255,120,120,.15);--amb2:rgba(255,120,120,.06)}
[data-theme="dark"] .mp[data-mood="flat"]{--amb1:rgba(138,147,163,.13);--amb2:rgba(130,168,255,.07)}
.layer{position:relative;z-index:2}

/* 状态栏 + 时段条 */
.statusbar{height:52px;display:flex;align-items:flex-end;justify-content:space-between;padding:0 22px 4px;font:600 12px/1 inherit;color:var(--t1)}
.session{
  margin:8px 18px 0;display:flex;align-items:center;gap:8px;
  font:600 11.5px/1 inherit;color:var(--t2);
}
.sdot{width:7px;height:7px;border-radius:50%;background:var(--fall);position:relative}
.sdot.live{background:var(--rise)}
.sdot.live::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:1.5px solid var(--rise);opacity:.5;animation:ring 2s infinite}
@keyframes ring{0%{transform:scale(.7);opacity:.6}100%{transform:scale(1.5);opacity:0}}
.sdot.off{background:var(--flat)}
.session .sep{color:var(--t3);opacity:.5}
.session .kj{margin-left:auto;font-weight:500;color:var(--t3);font-size:10.5px}

/* Hero 定性：无卡片，直接落在氛围底上 */
.hero{padding:20px 22px 0}
.hero-kicker{font:600 11px/1 inherit;color:var(--t3);letter-spacing:.4px}
.hero-title{
  margin-top:11px;font-size:30px;line-height:1.16;font-weight:800;letter-spacing:-1px;
}
.hero-title em{font-style:normal;color:var(--fall)}
.hero-title em.up{color:var(--rise)}
.hero-meta{margin-top:12px;display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.pill{
  font:600 11px/1 inherit;padding:5px 9px;border-radius:6px;background:var(--muted);color:var(--t2);
}
.pill.warn{background:var(--fallSoft);color:var(--fall)}
.pill.hot{background:var(--riseSoft);color:var(--rise)}

/* AI 内联注释：左 2px 品牌竖线，正文同色，无渐变无图标 */
.ai{
  margin:13px 22px 0;padding:1px 0 1px 11px;border-left:2px solid var(--brand);
  font-size:12.5px;line-height:1.62;color:var(--t2);
}
.ai b{color:var(--t1);font-weight:600}
.ai .src{color:var(--t3);font-size:11px}

/* 指数：主卡玻璃浮起 + 次级衬后（负边距重叠造景深） */
.idx-wrap{margin:22px 14px 0;position:relative}
.idx-back{
  display:flex;gap:8px;margin:0 12px;position:relative;z-index:1;
}
.idx-back .ib{
  flex:1;background:var(--surface);border:1px solid var(--div);border-radius:14px;
  padding:11px 12px 30px;box-shadow:var(--sh1);opacity:.9;
}
.idx-back .ib .n{font-size:11px;color:var(--t3);font-weight:600}
.idx-back .ib .v{margin-top:5px;font-size:16px;font-weight:700;letter-spacing:-.3px}
.idx-back .ib .c{margin-top:2px;font-size:11px;font-weight:600}
.idx-main{
  position:relative;z-index:3;margin-top:-22px;
  background:var(--glass);backdrop-filter:blur(20px) saturate(1.5);
  -webkit-backdrop-filter:blur(20px) saturate(1.5);
  border:1px solid var(--glassEdge);border-radius:18px;box-shadow:var(--sh3);
  padding:15px 16px 13px;
}
.im-top{display:flex;align-items:baseline;gap:9px}
.im-name{font-size:13px;font-weight:700}
.im-code{font-size:10.5px;color:var(--t3);font-weight:500}
.im-tag{margin-left:auto;font:600 10px/1 inherit;color:var(--t3);background:var(--muted);padding:4px 6px;border-radius:5px}
.im-price{margin-top:7px;display:flex;align-items:flex-end;gap:11px}
.im-price .p{font-size:38px;font-weight:800;letter-spacing:-1.6px;line-height:1}
.im-price .d{padding-bottom:4px;font-size:13px;font-weight:700;line-height:1.35}
.spark{margin-top:11px;height:44px;width:100%;display:block}
.im-foot{margin-top:9px;display:flex;gap:14px;font-size:11px;color:var(--t3)}
.im-foot b{color:var(--t2);font-weight:600}
.idx-more{
  margin:10px 12px 0;display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;
}
.idx-more::-webkit-scrollbar{display:none}
.chip{
  flex:0 0 auto;background:var(--surface);border:1px solid var(--div);border-radius:10px;
  padding:8px 10px;min-width:92px;box-shadow:var(--sh1);
}
.chip .n{font-size:10.5px;color:var(--t3);font-weight:600}
.chip .v{margin-top:3px;font-size:13px;font-weight:700;letter-spacing:-.2px}
.chip .c{font-size:10.5px;font-weight:600;margin-top:1px}
.chip.star{border-color:var(--rise);background:var(--riseSoft)}

/* 区块通用 */
.sec{margin:26px 22px 0}
.sec-h{display:flex;align-items:center;gap:7px;margin-bottom:12px}
.sec-h h3{font-size:13px;font-weight:700;letter-spacing:-.1px}
.sec-h .cal{font:500 10px/1 inherit;color:var(--t3);border:1px solid var(--div);padding:3px 5px;border-radius:4px;cursor:help}
.sec-h .more{margin-left:auto;font:600 11px/1 inherit;color:var(--t3);cursor:pointer}
.sec-h .more:hover{color:var(--brand)}

/* 量能条 */
.vol-head{display:flex;align-items:flex-end;gap:10px}
.vol-head .big{font-size:27px;font-weight:800;letter-spacing:-1px;line-height:1}
.vol-head .unit{font-size:12px;color:var(--t3);font-weight:600;padding-bottom:2px}
.vol-head .delta{margin-left:auto;font-size:12px;font-weight:700;padding-bottom:2px}
.volbars{margin-top:13px;display:flex;flex-direction:column;gap:8px}
.vb{display:flex;align-items:center;gap:9px}
.vb .lb{width:52px;font-size:10.5px;color:var(--t3);font-weight:600;flex:0 0 auto}
.vb .track{flex:1;height:7px;border-radius:4px;background:var(--muted);overflow:hidden}
.vb .fill{height:100%;border-radius:4px;transition:width 1.1s cubic-bezier(.22,.61,.36,1)}
.vb .vn{width:56px;text-align:right;font-size:10.5px;font-weight:600;color:var(--t2);flex:0 0 auto}

/* 市场宽度：中心分界比例条 */
.br-nums{display:flex;align-items:flex-end;justify-content:space-between}
.br-nums .s{display:flex;align-items:baseline;gap:5px}
.br-nums .s .n{font-size:25px;font-weight:800;letter-spacing:-.8px}
.br-nums .s .t{font-size:11px;color:var(--t3);font-weight:600}
.br-mid{text-align:center;font-size:10.5px;color:var(--t3);font-weight:600;padding-bottom:3px}
.brbar{margin-top:11px;height:12px;border-radius:7px;overflow:hidden;display:flex;background:var(--muted);box-shadow:var(--sh1)}
.brbar i{display:block;height:100%;transition:width 1.1s cubic-bezier(.22,.61,.36,1)}
.brbar i.up{background:var(--rise)}
.brbar i.fl{background:var(--flat);opacity:.45}
.brbar i.dn{background:var(--fall)}
.br-legend{margin-top:8px;display:flex;gap:13px;font-size:10.5px;color:var(--t3);font-weight:500}
.br-legend em{font-style:normal;font-weight:700}

/* 情绪四维：单玻璃面板 + 发丝分隔，非四张卡 */
.mood{
  background:var(--glass);backdrop-filter:blur(18px) saturate(1.4);
  -webkit-backdrop-filter:blur(18px) saturate(1.4);
  border:1px solid var(--glassEdge);border-radius:16px;box-shadow:var(--sh2);
  padding:14px 4px;display:flex;
}
.md{flex:1;padding:0 10px;border-right:1px solid var(--div);text-align:left}
.md:last-child{border-right:none}
.md .k{font-size:10px;color:var(--t3);font-weight:600;white-space:nowrap}
.md .v{margin-top:6px;font-size:20px;font-weight:800;letter-spacing:-.7px;line-height:1}
.md .x{margin-top:4px;font-size:10px;color:var(--t3);font-weight:500}
.md.l2 .v{color:var(--fall);animation:pulse 1.2s ease-in-out 2}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}

/* 连板梯队 */
.ladder{display:flex;flex-direction:column;gap:7px}
.ghost{
  display:flex;align-items:center;gap:9px;padding:7px 11px;border-radius:10px;
  border:1px dashed var(--div);color:var(--t3);font-size:11px;font-weight:600;
  background:transparent;
}
.ghost .gw{margin-left:auto;font-weight:500;opacity:.8}
.lay{
  display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:11px;
  background:var(--surface);border:1px solid var(--div);box-shadow:var(--sh1);cursor:pointer;
  transition:.2s ease;
}
.lay:hover{box-shadow:var(--sh2);transform:translateY(-1px)}
.lay .h{font-size:12px;font-weight:800;width:34px;flex:0 0 auto}
.lay .bar{height:8px;border-radius:5px;background:var(--rise);opacity:.85;flex:0 0 auto;min-width:8px}
.lay .cnt{font-size:11px;font-weight:700;color:var(--t2);flex:0 0 auto}
.lay .nm{margin-left:auto;font-size:10.5px;color:var(--t3);font-weight:500;text-align:right;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:150px}
.lay.top{background:var(--glass);border-color:var(--glassEdge);box-shadow:var(--sh2)}
.lay-detail{display:none;padding:9px 12px 2px;font-size:11px;color:var(--t2);line-height:1.7}
.lay-detail.on{display:block}
.lay-detail i{font-style:normal;color:var(--t3)}

/* 板块：#1 浮起玻璃 + #2-5 等级条 */
.sec-lead{
  background:var(--glass);backdrop-filter:blur(20px) saturate(1.5);
  -webkit-backdrop-filter:blur(20px) saturate(1.5);
  border:1px solid var(--glassEdge);border-radius:16px;box-shadow:var(--sh3);
  padding:14px 15px;position:relative;z-index:3;
}
.sl-top{display:flex;align-items:baseline;gap:8px}
.sl-rank{font-size:10px;font-weight:800;color:var(--rise);background:var(--riseSoft);padding:3px 6px;border-radius:5px}
.sl-name{font-size:16px;font-weight:800;letter-spacing:-.4px}
.sl-pct{margin-left:auto;font-size:22px;font-weight:800;color:var(--rise);letter-spacing:-.8px}
.sl-meta{margin-top:9px;display:flex;gap:13px;font-size:10.5px;color:var(--t3)}
.sl-meta b{color:var(--t2);font-weight:600}
.sl-stocks{margin-top:10px;display:flex;gap:6px;flex-wrap:wrap}
.sl-stocks span{font:600 10.5px/1 inherit;background:var(--riseSoft);color:var(--rise);padding:5px 7px;border-radius:5px}
.rank-list{margin:-8px 8px 0;padding-top:16px;position:relative;z-index:1;
  background:var(--surface);border:1px solid var(--div);border-top:none;border-radius:0 0 14px 14px;box-shadow:var(--sh1)}
.rk{display:flex;align-items:center;gap:9px;padding:8px 12px}
.rk .no{font-size:10px;color:var(--t3);font-weight:700;width:13px;flex:0 0 auto}
.rk .nm{font-size:12px;font-weight:600;width:80px;flex:0 0 auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rk .grade{flex:1;height:6px;border-radius:4px;background:var(--muted);overflow:hidden}
.rk .grade i{display:block;height:100%;border-radius:4px;background:var(--rise);opacity:.75;transition:width .9s cubic-bezier(.22,.61,.36,1)}
.rk .grade i.dn{background:var(--fall)}
.rk .pct{font-size:11.5px;font-weight:700;width:52px;text-align:right;flex:0 0 auto}
.rk .zt{font-size:10px;color:var(--t3);width:34px;text-align:right;flex:0 0 auto;font-weight:600}
.seg{display:flex;gap:6px;margin:14px 0 10px}
.seg button{
  font:600 11px/1 inherit;border:1px solid var(--div);background:var(--surface);color:var(--t2);
  padding:6px 10px;border-radius:7px;cursor:pointer;transition:.16s;
}
.seg button[aria-pressed="true"]{background:var(--t1);border-color:var(--t1);color:var(--page)}

/* 热力图 */
.heat{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:4px}
.hcell{border-radius:7px;padding:8px 6px;cursor:pointer;transition:transform .2s,box-shadow .2s;min-height:52px;
  display:flex;flex-direction:column;justify-content:space-between}
.hcell:hover{transform:scale(1.05);box-shadow:var(--sh2);z-index:5;position:relative}
.hcell .n{font-size:9.5px;font-weight:700;line-height:1.25}
.hcell .p{font-size:11px;font-weight:800;letter-spacing:-.2px}

/* 资金三行 */
.flow{background:var(--surface);border:1px solid var(--div);border-radius:14px;box-shadow:var(--sh1);overflow:hidden}
.fl{display:flex;align-items:center;gap:10px;padding:12px 13px;border-bottom:1px solid var(--div)}
.fl:last-child{border-bottom:none}
.fl .k{font-size:11.5px;font-weight:700;width:66px;flex:0 0 auto}
.fl .body{flex:1;min-width:0}
.fl .v{font-size:14px;font-weight:800;letter-spacing:-.3px}
.fl .sub{font-size:10.5px;color:var(--t3);margin-top:3px;line-height:1.5}
.fl .arrow{font-size:15px;font-weight:800;flex:0 0 auto}

/* 底部 AI 收口 */
.ai-close{
  margin:26px 22px 0;padding:14px 15px;border-radius:14px;
  background:var(--brandSoft);display:flex;align-items:center;gap:11px;cursor:pointer;
}
.ai-close .t{font-size:12.5px;font-weight:700;color:var(--brand)}
.ai-close .s{font-size:11px;color:var(--t2);margin-top:3px;line-height:1.5}
.ai-close .go{margin-left:auto;font-size:15px;color:var(--brand);font-weight:700}
.foot-note{margin:16px 22px 0;font-size:10px;color:var(--t3);line-height:1.7}

/* 刷新提示条 */
.refresh{
  position:absolute;top:52px;left:0;right:0;z-index:50;text-align:center;
  font:600 11px/1 inherit;color:var(--brand);padding:8px 0;background:var(--brandSoft);
  transform:translateY(-100%);transition:transform .32s cubic-bezier(.32,.72,0,1);
}
.refresh.on{transform:translateY(0)}

/* tick flash */
.flash-up{animation:fu .6s ease}
.flash-dn{animation:fd .6s ease}
@keyframes fu{0%{background:transparent}14%{background:var(--riseSoft)}50%{background:var(--riseSoft)}100%{background:transparent}}
@keyframes fd{0%{background:transparent}14%{background:var(--fallSoft)}50%{background:var(--fallSoft)}100%{background:transparent}}

/* 午休/休市灰化 */
.mp.dim{filter:saturate(.55);transition:filter .9s ease-in-out}
.mp.dim .sdot.live::after{display:none}

.up{color:var(--rise)} .dn{color:var(--fall)} .fl0{color:var(--flat)}
.bgup{background:var(--rise)} .bgdn{background:var(--fall)}

@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}
</style>
</head>
<body data-theme="light">

<div class="stage-head">
  <div class="sh-top">
    <div>
      <div class="sh-title">市场界面重构 · 原型 v2</div>
      <div class="sh-sub">全部数字为 2026-09-02 A 股真实收盘数据 · 依据 doc 21 信息架构 + doc 22 动效规范 · 配色锁定 doc 19 权威 token</div>
    </div>
    <div class="sh-tools">

/* ===== 交互 ===== */
function bindAll(){
  document.querySelectorAll("[data-lay]").forEach(el=>{
    el.onclick=()=>{
      const d=el.parentElement.querySelector(`[data-det="${el.dataset.lay}"]`);
      if(d) d.classList.toggle("on");
    };
  });
  document.querySelectorAll("[data-seg]").forEach(b=>{
    b.onclick=()=>{
      const wrap=b.closest(".sec");
      wrap.querySelectorAll("[data-seg]").forEach(x=>x.setAttribute("aria-pressed",x===b?"true":"false"));
      wrap.querySelectorAll("[data-pane]").forEach(p=>p.hidden = p.dataset.pane!==b.dataset.seg);
    };
  });
  document.querySelectorAll(".sparkline").forEach(p=>{
    try{
      const L=p.getTotalLength();
      p.style.strokeDasharray=L; p.style.strokeDashoffset=L;
      p.animate([{strokeDashoffset:L},{strokeDashoffset:0}],{duration:680,easing:"ease-out",fill:"forwards"});
    }catch(e){}
  });
}

/* tick 模拟：仅演示 flash 与节流合并，数值围绕真实收盘价小幅摆动 */
let tickTimer=null;
document.getElementById("tickBtn").onclick=e=>{
  const b=e.currentTarget; const on=b.classList.toggle("on");
  if(on){
    tickTimer=setInterval(()=>{
      document.querySelectorAll('#v-full [data-tick], #v-home [data-tick]').forEach(el=>{
        if(el.closest(".dim")) return;
        const base=parseFloat(el.textContent.replace(/,/g,""));
        const d=(Math.random()-0.5)*(base>1000?1.4:0.006);
        const nv=base+d;
        el.textContent = base>1000 ? nv.toFixed(2) : nv.toFixed(2);
        el.classList.remove("flash-up","flash-dn");
        void el.offsetWidth;
        el.classList.add(d>0?"flash-up":"flash-dn");
      });
    },1600);
  }else{ clearInterval(tickTimer); }
};

        el.classList.remove("flash-up","flash-dn"); void el.offsetWidth; el.classList.add("flash-dn");
      },i*30));
      setTimeout(()=>r.classList.remove("on"),1600);
    },900);
  });
};

document.getElementById("themeBtn").onclick=e=>{
  const d=document.body.dataset.theme==="dark";
  document.body.dataset.theme=d?"light":"dark";
  e.currentTarget.textContent=d?"切换深色":"切换浅色";
  render();
};

document.querySelectorAll(".tab").forEach(t=>{
  t.onclick=()=>{
    document.querySelectorAll(".tab").forEach(x=>x.setAttribute("aria-selected",x===t?"true":"false"));
    document.querySelectorAll(".view").forEach(v=>v.classList.toggle("on",v.id==="v-"+t.dataset.v));
  };
});

render();
</script>
</body>
</html>
