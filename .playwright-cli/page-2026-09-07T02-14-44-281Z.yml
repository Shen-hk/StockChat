      - heading "氛围色由涨跌驱动" [level=3] [ref=e623]
      - paragraph [ref=e624]:
        - text: 整页顶部 wash 取
        - code [ref=e625]: riseSoft / fallSoft
        - text: ，60% 处渐隐回 page 底色；走势卡后置同色 radial 光晕。价格、涨跌 pill、蒙层值、量能条全部走同一语义色；平盘/停牌整体降饱和取
        - code [ref=e626]: flat
        - text: 灰。只复用 doc 19 权威 token，不新增饱和色。
    - generic [ref=e627]:
      - generic [ref=e628]: "2"
      - heading "自绘分时 = 页面第一实体" [level=3] [ref=e629]
      - paragraph [ref=e630]: 高度 132px → 约 340px（3.2 倍篇幅），信息密度同步升级：价格线（语义色 + draw-on）+ 均价线（虚线）+ 昨收虚线基准 + 上下对称涨跌幅轴 + 分钟量能 + 最高/最低锚点 + 十字光标随值卡。数据源不变（腾讯分时，实测可用），优化的是绘法与篇幅，不是换资源。
    - generic [ref=e631]:
      - generic [ref=e632]: "3"
      - heading "行情数据 → 图表蒙层" [level=3] [ref=e633]
      - paragraph [ref=e634]:
        - text: 今开 / 最高 / 最低 / 换手率四个「读走势时最想要」的值，收成一条玻璃 chip 条（
        - code [ref=e635]: marketGlass + blur14
        - text: ）压在走势底部——按涨跌相对昨收着色。从「与走势并列的 8 格卡」变成「走势的注脚」，主次即层级。
    - generic [ref=e636]:
      - generic [ref=e637]: "4"
      - heading "其余指标 → 次级行" [level=3] [ref=e638]
      - paragraph [ref=e639]: 成交量 / 成交额 / 总市值与昨收 / PE / PB / 振幅收为卡下两行小字（muted 面、9.5px 标签），不再与走势争位。AI 只保留一行事实性归因（盘中涨跌驱动的一句陈述），无「问 AI」按钮铺陈，符合 AI 克制三铁律。
