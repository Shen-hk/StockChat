  }

  /* ===== 星空背景 ===== */
  .stars, .stars2 {
    position: fixed; inset: 0; pointer-events: none;
  }
  .stars {
    background-image:
      radial-gradient(1px 1px at 12% 22%, rgba(255,255,255,.5) 50%, transparent 50%),
      radial-gradient(1px 1px at 78% 12%, rgba(255,255,255,.35) 50%, transparent 50%),
      radial-gradient(1.5px 1.5px at 32% 74%, rgba(255,255,255,.4) 50%, transparent 50%),

      radial-gradient(1px 1px at 55% 38%, rgba(255,255,255,.45) 50%, transparent 50%),
      radial-gradient(1.5px 1.5px at 8% 82%, rgba(255,255,255,.3) 50%, transparent 50%),
      radial-gradient(1px 1px at 68% 88%, rgba(255,255,255,.35) 50%, transparent 50%),
      radial-gradient(1px 1px at 42% 8%, rgba(255,255,255,.4) 50%, transparent 50%),
      radial-gradient(1.5px 1.5px at 93% 30%, rgba(255,255,255,.25) 50%, transparent 50%),
      radial-gradient(1px 1px at 22% 48%, rgba(255,255,255,.3) 50%, transparent 50%);
  }
  .nebula {
    position: fixed; inset: 0; pointer-events: none;
    background:
      radial-gradient(600px 400px at 70% 30%, rgba(47,111,237,.08), transparent 70%),
      radial-gradient(500px 380px at 25% 70%, rgba(124,92,255,.07), transparent 70%),
      radial-gradient(700px 500px at 50% 50%, rgba(229,72,77,.03), transparent 70%);
  }

  /* ===== 顶部标题 ===== */
  .head {
    position: fixed; top: 22px; left: 28px; z-index: 10;
  }
  .head h1 {
    font-size: 17px; font-weight: 700; letter-spacing: 1px;
    color: #f2f5fb; display: flex; align-items: center; gap: 10px;
  }
  .head h1 .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: #ff5a5f; box-shadow: 0 0 10px #ff5a5f;
    animation: breathe 2.4s ease-in-out infinite;
  }
  @keyframes breathe { 50% { opacity: .35; } }
  .head p { font-size: 12px; color: #7d8798; margin-top: 5px; letter-spacing: .5px; }

  .meta {
    position: fixed; top: 24px; right: 28px; z-index: 10;
    text-align: right; font-size: 11.5px; color: #6b7484; line-height: 1.9;
  }
  .meta b { color: #c6cedd; font-weight: 600; }

  /* ===== 底部提示 ===== */
  .hint {
    position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%);
    z-index: 10; font-size: 12px; color: #66707f; letter-spacing: 1px;
    display: flex; align-items: center; gap: 18px; white-space: nowrap;
  }
  .hint span { display: flex; align-items: center; gap: 6px; }
  .lg { width: 14px; height: 14px; border-radius: 50%; display: inline-block; }
  .lg.solid { background: radial-gradient(circle at 35% 35%, #bfe0ff, #3f8cff 70%); box-shadow: 0 0 8px rgba(80,150,255,.8); }
  .lg.ghost { border: 1.5px dashed #ff5a5f; box-shadow: 0 0 8px rgba(255,90,95,.4); }
  .lg.sat { background: #8fa0b8; width: 7px; height: 7px; }

  /* ===== SVG 画布 ===== */
  svg.canvas { position: fixed; inset: 0; width: 100%; height: 100%; }

  .node { cursor: pointer; }
  .node text { pointer-events: none; }
  .node .halo { opacity: 0; transition: opacity .25s; }
  .node:hover .halo, .node.sel .halo { opacity: 1; }
  .node .body { transition: all .25s; }
  .node.ghost .ring {
    animation: ghostPulse 2.2s ease-in-out infinite;
    transform-origin: center; transform-box: fill-box;
  }
  @keyframes ghostPulse {
    0%, 100% { opacity: .55; }
    50% { opacity: 1; }
  }

  /* 选中聚焦：其余暗掉 */
  svg.focus .node:not(.sel) { opacity: .18; transition: opacity .3s; }
  svg.focus .edge { opacity: .1; transition: opacity .3s; }
  svg.focus .edge.lit { opacity: 1; }
  svg.focus .satellite:not(.sel) { opacity: .12; }
  .node, .edge, .satellite { transition: opacity .3s; }

  .satellite { cursor: pointer; }
  .satellite text { font-size: 10.5px; fill: #93a0b4; }

  .edge-label { font-size: 10.5px; fill: #6b7484; letter-spacing: 1px; }
  .broken-label {
    font-size: 11px; fill: #ff7b80; font-weight: 600; letter-spacing: 1.5px;
    animation: ghostPulse 2.2s ease-in-out infinite;
  }

  /* ===== 中央指标 ===== */
  .center-num { font-size: 44px; font-weight: 800; fill: #f2f5fb; letter-spacing: -1px; }
  .center-lab { font-size: 11.5px; fill: #7d8798; letter-spacing: 2px; }

  /* ===== AI 解析浮层 ===== */
  .panel {
    position: fixed; right: 26px; top: 90px; width: 330px; z-index: 20;
    background: rgba(17, 22, 34, .88);
    backdrop-filter: blur(14px);
    border: 1px solid rgba(120, 140, 180, .18);
    border-radius: 16px;
    padding: 18px 20px 16px;
    box-shadow: 0 20px 60px rgba(0,0,0,.5);
    opacity: 0; transform: translateX(16px); pointer-events: none;
    transition: all .3s cubic-bezier(.2,.8,.3,1);
    max-height: calc(100vh - 130px); overflow-y: auto;
  }
  .panel.show { opacity: 1; transform: translateX(0); pointer-events: auto; }
  .panel::-webkit-scrollbar { width: 4px; }
  .panel::-webkit-scrollbar-thumb { background: #2c3444; border-radius: 4px; }

  .p-tag {
    display: inline-block; font-size: 10.5px; font-weight: 700; letter-spacing: 2px;
    padding: 3px 10px; border-radius: 999px; margin-bottom: 8px;
  }
  .p-tag.miss { background: rgba(255,90,95,.14); color: #ff7b80; border: 1px solid rgba(255,90,95,.3); }
  .p-tag.weak { background: rgba(255,183,77,.12); color: #ffc46b; border: 1px solid rgba(255,183,77,.28); }
  .p-tag.ok   { background: rgba(87,217,163,.12); color: #5fe0a8; border: 1px solid rgba(87,217,163,.28); }

  .p-title { font-size: 17px; font-weight: 800; color: #f2f5fb; margin-bottom: 4px; }
  .p-sub { font-size: 11px; color: #6b7484; margin-bottom: 12px; }

  .p-quote {

  .p-ai {

  }

<script>
const NODES = {

    fix:['把热点当"研究线索池"，而不是"买入信号"','触发后先问：这是我发现的，还是别人已经买完的？'],

    fix:['每个"逻辑"强制拆三层：已验证事实 / 市场预期 / 纯猜测','只允许事实层进入决策，猜测层直接丢弃'],

    ai:'你把【价格强势】当成了【基本面证据】。正确顺序：先回答"它凭什么涨、涨到多少合理"，再看价格是否还留有余地——你现在做的是反的。',
    fix:['买入前三问：凭什么涨 / 已经涨了多少 / 我错了怎么知道','为每笔买入写 2 条反方证据，找不到反方 = 没想清楚'],
    freq:'这是整条链路上最大的空洞 · 修复优先级 P0' },
  n4: { tag:'weak', tagText:'薄弱环节', title:'④ 买入', sub:'进场集中在突破新高后 1–3 天，仓位与确信度无关',
    quote:'先买半仓试试水，感觉对了再加',
    ai:'"试试水"暴露了你自己都不确信。半仓试错的真实代价不是那半仓的亏损，而是它让你的注意力被一只自己都没想通的票占住。',
    fix:['仓位 = 确信度 × 预案完整度，两者缺一，仓位归零'],
    freq:'关联标的：中际旭创 · 宁德时代 · 贵州茅台' },
  n5: { tag:'miss', tagText:'断链 ②', title:'预案 · 缺失', sub:'27 笔交易没有任何事前的止损 / 目标 / 失效条件',
    quote:'先买进去再说，跌了我就扛，反正茅台不会一直跌',
    ai:'"反正不会一直跌"是安抚，不是论证。没有预案意味着：真正的决策被推迟到你最不理性的时刻——亏损当中才做。',
    fix:['下单前必须填写【失效条件 → 动作】清单','产品内：AI 拦截一切无预案的买入请求'],
    freq:'与断链①强相关：不验证的人也不会有预案 · P0' },
  n6: { tag:'weak', tagText:'薄弱环节', title:'⑥ 持有', sub:'大跌日的提问量是平日 4 倍，内容以寻求安慰为主',
    quote:'今天又跌 3 个点，心态有点崩，是不是该跑了？',
    ai:'"心态崩"不是信息，是情绪，但你在把情绪当信号用。持有期唯一有效的问题只有一个：当初的失效条件触发了吗？没有 → 不操作。',
    fix:['波动日只回答一个问题：失效条件触发了吗？'],
    freq:'持仓期对话占总对话量 41%' },
  n7: { tag:'miss', tagText:'断链 ③', title:'复盘 · 缺失', sub:'47 次会话，0 次主动复盘。同样错误 6–9 月重复 3 轮以上',
    quote:'（无相关记录——这恰恰是问题所在）',
    ai:'没有复盘，每笔交易都是孤立样本，不产生任何学习信号。这就是"感觉交易了很久但没变强"的直接原因。拓扑思维的核心就是闭合这一环。',
    fix:['平仓自动触发 AI 复盘：当初逻辑 vs 实际走势','对错归因回填，沉淀为你的个人决策规则库'],
    freq:'结构性缺失 · 修复后断链可闭合 · P0' },
  n8: { tag:'ok', tagText:'常态环节', title:'⑧ 卖出', sub:'两大触发器：跌到受不了（恐慌）、回到成本价（解脱）',
    quote:'终于回本了，清了清了，再也不碰它了',
    ai:'"再也不碰"说明这笔交易没产生认知增量——你只是逃离了一次不适。回本卖出 = 用成本价而非标的逻辑做决策。卖出理由只能来自：逻辑兑现 / 逻辑失效 / 更好的机会。',
    fix:['每次卖出后立即回填当初的三层归因表','把"回本"从决策词汇表里删掉'],
    freq:'恐慌性卖出占 62% · 逻辑驱动卖出占 9%' },
  s1: { tag:'weak', tagText:'高频标的', title:'中际旭创', sub:'被讨论 8 次 · 追涨进场 3 次 · 无一次查过估值',
    quote:'中际旭创又创新高了，CPO 这波逻辑很硬吧？',
    ai:'它是你"归因替代验证"模式的头号样本：每次讨论都发生在创新高之后，每次结论都是"逻辑硬"。',
    fix:['下次再点开它之前，先做完买入三问'],
    freq:'讨论 8 次 · 实际操作 3 次 · 复盘 0 次' },
  s2: { tag:'miss', tagText:'高频标的', title:'贵州茅台', sub:'被讨论 6 次 · "回本"一词出现 11 次',
    quote:'跌了 15% 了，更便宜了，要不要补一点快点回本？',
    ai:'你的成本锚在这只票上最重："便宜"的参照系是你的成本价而非基本面。市场不知道你的成本。',
    fix:['做清零测试：假设今天空仓，还会买吗？'],
    freq:'讨论 6 次 · "回本" 11 次 · 清零测试 0 次' },
  s3: { tag:'ok', tagText:'高频标的', title:'宁德时代', sub:'被讨论 5 次 · 9 月起出现条件式思考',
    quote:'这次我想先想清楚再买：如果锂价企稳 + 排产数据确认，我才进；跌破前低就认错离场',
    ai:'这是你 212 条片段里第一次出现完整的【条件 → 动作】结构。正确直觉已经发芽——下一步是让它成为默认习惯，而不是偶然。',
    fix:['把这条消息的思考结构做成你的下单模板'],
    freq:'讨论 5 次 · 正确结构出现 1 次（最新）' }
};

const svg = document.getElementById('svg');
const panel = document.getElementById('panel');
let current = null;

function openNode(key) {
  const d = NODES[key];
  if (!d) return;
  current = key;
  const tag = document.getElementById('pTag');
  tag.className = 'p-tag ' + d.tag;
  tag.textContent = d.tagText;
  document.getElementById('pTitle').textContent = d.title;
  document.getElementById('pSub').textContent = d.sub;
  document.getElementById('pQuote').textContent = '“' + d.quote + '”';
  document.getElementById('pAi').textContent = d.ai;
  document.getElementById('pFix').innerHTML = d.fix.map(f => '<li>' + f + '</li>').join('');
  document.getElementById('pFreq').innerHTML = d.freq;
  panel.classList.add('show');
  // 聚焦：点亮自身与相连边
  document.querySelectorAll('.node, .satellite').forEach(n => n.classList.remove('sel'));
  const el = document.querySelector('[data-node="' + key + '"]');
  if (el) el.classList.add('sel');
  svg.classList.add('focus');
  document.querySelectorAll('.edge').forEach(e => e.classList.remove('lit'));
  const litMap = { n1:['e-n1-n2'], n2:['e-n1-n2','e-n2-n4','e-n2-n3'], n3:['e-n2-n3'],
    n4:['e-n2-n4','e-n4-n6','e-n4-n5'], n5:['e-n4-n5'], n6:['e-n4-n6','e-n6-n7','e-n6-n8'],
    n7:['e-n6-n7'], n8:['e-n6-n8','e-n8-n1'] };
  (litMap[key] || []).forEach(id => { const e = document.getElementById(id); if (e) e.classList.add('lit'); });
}

document.querySelectorAll('.node, .satellite').forEach(g => {
  g.addEventListener('click', e => { e.stopPropagation(); openNode(g.dataset.node); });
});

function closePanel() {
  panel.classList.remove('show');
  svg.classList.remove('focus');
  document.querySelectorAll('.node, .satellite').forEach(n => n.classList.remove('sel'));
  current = null;
}
document.getElementById('pClose').addEventListener('click', closePanel);
svg.addEventListener('click', () => { if (current) closePanel(); });

// 入场：默认 1.5s 后自动打开最大断链，引导视线
setTimeout(() => { if (!current) openNode('n3'); }, 1600);
</script>
